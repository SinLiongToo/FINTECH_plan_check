name: Daily Stock Data Update

on:
  schedule:
    # Taiwan market close: 06:30 UTC = 14:30 Taipei
    - cron: '30 6 * * 1-5'
    # US market close: 22:00 UTC = 18:00 EST / 06:00 (+1d) Taipei
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest stock data
        run: python fetch_stock_data.py --all

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_data.json
          if git diff --staged --quiet; then
            echo "No stock data changes; skipping commit."
          else
            git commit -m "Automated stock data update"
            git push origin HEAD:master
          fi
