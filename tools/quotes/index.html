  ['lynch', '不要投資一個你無法用蠟筆畫出來的點子。', 'Never invest in any idea you can’t illustrate with a crayon.'],
  ['lynch', '在這一行，如果你很厲害，十次裡能對六次。', 'In this business, if you’re good, you’re right six times out of ten.'],
  ['lynch', '去找一家連笨蛋都能經營的公司，因為遲早會有笨蛋來經營它。', 'Go for a business that any idiot can run – because sooner or later, any idiot probably is going to run it.'],
  ['lynch', '每個人都有在股市賺錢的腦力，但不是每個人都有那個膽量。', 'Everyone has the brainpower to make money in stocks. Not everyone has the stomach.'],
  ['lynch', '翻開最多石頭的人，才會贏得這場遊戲。', 'The person that turns over the most rocks wins the game.'],

  ['bogle', '不要在乾草堆裡找針，直接把整個乾草堆買下來！', 'Don’t look for the needle in the haystack. Just buy the haystack!'],
  ['bogle', '時間是你的朋友，衝動是你的敵人。', 'Time is your friend; impulse is your enemy.'],
  ['bogle', '股市是讓人從投資這件事上分心的巨大干擾。', 'The stock market is a giant distraction to the business of investing.'],
  ['bogle', '在投資上，你沒有付出的成本，才是你真正得到的。', 'In investing, you get what you don’t pay for.'],
  ['bogle', '如果你無法想像股市下跌 20%，你就不該持有股票。', 'If you have trouble imagining a 20% loss in the stock market, you shouldn’t be in stocks.'],
  ['bogle', '投資成功的致勝公式：透過指數基金持有整個股市，然後什麼都不做，堅持到底。', 'The winning formula for success in investing is owning the entire stock market through an index fund, and then doing nothing. Just stay the course.'],
  ['bogle', '別急著做什麼，就站在那裡！', 'Don’t do something, just stand there!'],

  ['templeton', '投資中最危險的四個字是：「這次不同」。', 'The four most dangerous words in investing are: ‘this time it’s different.’'],
  ['templeton', '牛市在悲觀中誕生，在懷疑中成長，在樂觀中成熟，在狂喜中死亡。', 'Bull markets are born on pessimism, grow on skepticism, mature on optimism, and die on euphoria.'],
  ['templeton', '最悲觀的時候是最好的買點，最樂觀的時候是最好的賣點。', 'The time of maximum pessimism is the best time to buy, and the time of maximum optimism is the best time to sell.'],
  ['templeton', '想要表現得比群眾好，就必須做和群眾不一樣的事。', 'If you want to have a better performance than the crowd, you must do things differently from the crowd.'],
  ['templeton', '唯一不需要分散投資的人，是那些百分之百都對的人。', 'The only investors who shouldn’t diversify are those who are right 100% of the time.'],

  ['soros', '重要的不是你對或錯，而是對的時候賺多少、錯的時候賠多少。', 'It’s not whether you’re right or wrong that’s important, but how much money you make when you’re right and how much you lose when you’re wrong.'],
  ['soros', '市場永遠處於不確定與變動之中，賺錢靠的是忽略顯而易見的事，押注意料之外的事。', 'Markets are constantly in a state of uncertainty and flux, and money is made by discounting the obvious and betting on the unexpected.'],

  ['fisher', '股市裡充滿了知道所有東西價格、卻不知道任何東西價值的人。', 'The stock market is filled with individuals who know the price of everything, but the value of nothing.'],
  ['fisher', '如果買進時功課做得對，賣出的時機幾乎是——永遠不要。', 'If the job has been correctly done when a common stock is purchased, the time to sell it is—almost never.'],

  ['keynes', '市場維持不理性的時間，可能比你維持不破產的時間還長。', 'The market can remain irrational longer than you can remain solvent.', 1],
  ['keynes', '困難不在於發展新想法，而在於擺脫舊想法。', 'The difficulty lies not so much in developing new ideas as in escaping from old ones.'],

  ['franklin', '投資知識，能得到最好的利息。', 'An investment in knowledge pays the best interest.'],
  ['franklin', '小心小開銷，一個小漏洞就能讓大船沉沒。', 'Beware of little expenses; a small leak will sink a great ship.'],
  ['franklin', '寧可不吃晚餐就上床，也不要一早醒來就負債。', 'Rather go to bed without dinner than to rise in debt.'],
  ['franklin', '時間就是金錢。', 'Time is money.'],

  ['marks', '你無法預測，但你可以準備。', 'You can’t predict. You can prepare.'],
  ['marks', '領先時代太多，跟犯錯看起來沒有兩樣。', 'Being too far ahead of your time is indistinguishable from being wrong.'],
  ['marks', '世界上最危險的事，就是相信沒有風險。', 'The riskiest thing in the world is the belief that there’s no risk.'],

  ['dalio', '靠水晶球過活的人，終將吞下碎玻璃。', 'He who lives by the crystal ball will eat shattered glass.'],
  ['dalio', '痛苦 + 反思 = 進步。', 'Pain + Reflection = Progress.'],
  ['dalio', '做好分散，是你為了投資成功最重要的一件事。', 'Diversifying well is the most important thing you need to do in order to invest well.'],

  ['klarman', '價值投資的核心，是逆向思考與計算機的結合。', 'Value investing is at its core the marriage of a contrarian streak and a calculator.'],

  ['livermore', '華爾街沒有新鮮事，今天股市發生的事，過去發生過，未來也會再發生。', 'There is nothing new in Wall Street. Whatever happens in the stock market today has happened before and will happen again.'],
  ['livermore', '讓我賺大錢的從來不是我的思考，而是我的坐著不動。', 'It never was my thinking that made the big money for me. It always was my sitting.'],
  ['livermore', '市場永遠不會錯，錯的往往是人的看法。', 'The market is never wrong – opinions often are.'],

  ['samuelson', '投資應該像看油漆變乾、看草生長一樣無聊。想要刺激，就拿 800 美元去拉斯維加斯。', 'Investing should be more like watching paint dry or watching grass grow. If you want excitement, take $800 and go to Las Vegas.'],

  ['kiyosaki', '重點不是你賺多少錢，而是你能留住多少錢。', 'It’s not how much money you make, but how much money you keep.'],

  ['ramsey', '你必須掌控你的錢，否則缺錢將永遠掌控你。', 'You must gain control over your money or the lack of it will forever control you.'],
  ['ramsey', '負債是愚蠢的，現金為王。', 'Debt is dumb, cash is king.'],

  ['housel', '存錢，就是你的自尊心與收入之間的差距。', 'Saving money is the gap between your ego and your income.'],
  ['housel', '理財做得好，跟你多聰明關係不大，跟你怎麼做關係很大。', 'Doing well with money has a little to do with how smart you are and a lot to do with how you behave.'],

  ['taleb', '不要涉水過一條平均只有四呎深的河。', 'Don’t cross a river if it is four feet deep on average.'],

  ['kostolany', '買進股票，吃下安眠藥，然後好幾年都不要看報紙。', 'Buy stocks, take sleeping pills, and don’t look at the paper for years.'],
  ['kostolany', '經濟是主人，股市是狗：狗會前後亂跑，但最終會和主人一起抵達終點。', 'The economy is the man and the stock market is his dog: the dog runs back and forth, but they arrive together.'],

  ['proverb', '不要把所有的雞蛋放在同一個籃子裡。', 'Don’t put all your eggs in one basket.'],
  ['bible', '欠債的是債主的僕人。', 'The borrower is slave to the lender.'],
  ['einstein', '複利是世界第八大奇蹟，懂的人賺它，不懂的人付它。', 'Compound interest is the eighth wonder of the world. He who understands it, earns it; he who doesn’t, pays it.', 1],

  // ── #101–200 ──────────────────────────────────────────────────────────
  ['buffett', '只買那些就算股市關閉十年，你也能安心持有的東西。', 'Only buy something that you’d be perfectly happy to hold if the market shut down for 10 years.'],
  ['buffett', '投資人最重要的特質是性情，而不是智力。', 'The most important quality for an investor is temperament, not intellect.'],
  ['buffett', '除非你能眼看持股下跌 50% 而不驚慌，否則你不該待在股市。', 'Unless you can watch your stock holding decline by 50% without becoming panic-stricken, you should not be in the stock market.'],
  ['buffett', '股市是一場沒有「好球不揮被判三振」的比賽，你不必每球都揮棒，可以等待屬於你的那一球。', 'The stock market is a no-called-strike game. You don’t have to swing at everything – you can wait for your pitch.'],
  ['buffett', '多和比你優秀的人在一起。', 'It’s better to hang out with people better than you.'],
  ['buffett', '在商業世界裡，後照鏡永遠比擋風玻璃看得清楚。', 'In the business world, the rearview mirror is always clearer than the windshield.'],
  ['buffett', '投資，就是現在投入金錢，以便在未來拿回更多的錢。', 'Investing is laying out money now to get more money back in the future.'],
  ['buffett', '民意調查無法取代獨立思考。', 'A public-opinion poll is no substitute for thought.'],
  ['buffett', '我們不必比別人聰明，但必須比別人更有紀律。', 'We don’t have to be smarter than the rest. We have to be more disciplined than the rest.'],
  ['buffett', '如果企業經營得好，股價最終會跟上。', 'If a business does well, the stock eventually follows.'],
  ['buffett', '持續買進低成本的 S&P 500 指數基金，我認為幾乎任何時候這都是最合理的做法。', 'Consistently buy an S&P 500 low-cost index fund. I think it’s the thing that makes the most sense practically all of the time.'],
  ['buffett', '別再試圖預測股市、經濟、利率或選舉的走向。', 'Stop trying to predict the direction of the stock market, the economy, interest rates, or elections.'],
  ['buffett', '投資人應該記住：刺激與費用都是他們的敵人。', 'Investors should remember that excitement and expenses are their enemies.'],
  ['buffett', '智者一開始做的事，愚者到最後才做。', 'What the wise do in the beginning, fools do in the end.'],
  ['buffett', '讓公司賠錢，我可以諒解；讓公司名譽受損一絲一毫，我將毫不留情。', 'Lose money for the firm, and I will be understanding. Lose a shred of reputation for the firm, and I will be ruthless.'],
  ['buffett', '人性似乎有一種反常的特質，喜歡把簡單的事情變複雜。', 'There seems to be some perverse human characteristic that likes to make easy things difficult.'],
  ['buffett', '我們的方法很大程度是從「不變」中獲利，而不是從「變化」中獲利。', 'Our approach is very much profiting from lack of change rather than from change.'],

  ['munger', '我只想知道我會死在哪裡，這樣我就永遠不去那個地方。', 'All I want to know is where I’m going to die, so I’ll never go there.'],
  ['munger', '投資本來就不該容易，覺得它容易的人都是傻瓜。', 'It’s not supposed to be easy. Anyone who finds it easy is stupid.'],
  ['munger', '驅動世界的不是貪婪，而是嫉妒。', 'The world is not driven by greed. It’s driven by envy.'],
  ['munger', '對拿著鐵鎚的人來說，每個問題看起來都像釘子。', 'To a man with a hammer, everything looks like a nail.'],
  ['munger', '長期來看，一檔股票的報酬很難遠遠超過它背後企業所賺的報酬。', 'Over the long term, it’s hard for a stock to earn a much better return than the business which underlies it earns.'],
  ['munger', '模仿群眾，只會讓你回歸平均。', 'Mimicking the herd invites regression to the mean.'],
  ['munger', '你喜歡某樣東西，不代表世界就一定會給你。', 'Just because you like it does not mean that the world will necessarily give it to you.'],
  ['munger', '我沒有什麼要補充的。', 'I have nothing to add.'],

  ['graham', '個人投資人應該始終以投資人自居，而不是投機者。', 'The individual investor should act consistently as an investor and not as a speculator.'],
  ['graham', '價格波動對真正的投資人只有一個意義：大跌時提供明智買進的機會，大漲時提供明智賣出的機會。', 'Price fluctuations have only one significant meaning for the true investor. They provide him with an opportunity to buy wisely when prices fall sharply and to sell wisely when they advance a great deal.'],
  ['graham', '市場是一個鐘擺，永遠在不可持續的樂觀與沒有根據的悲觀之間擺盪。', 'The market is a pendulum that forever swings between unsustainable optimism and unjustified pessimism.', 1],
  ['graham', '不要因為樂觀而買，要因為算術而買。', 'Buy not on optimism, but on arithmetic.'],
  ['graham', '群眾不同意你，並不代表你對或錯；你是對的，是因為你的資料和推理是對的。', 'You are neither right nor wrong because the crowd disagrees with you. You are right because your data and reasoning are right.'],
  ['graham', '即使是聰明的投資人，也需要相當的意志力，才能避免跟隨群眾。', 'Even the intelligent investor is likely to need considerable will power to keep from following the crowd.'],

  ['lynch', '投資你所了解的東西。', 'Invest in what you know.'],
  ['lynch', '持有股票就像養小孩：不要養超過你能照顧的數量。', 'Owning stocks is like having children — don’t get involved with more than you can handle.'],
  ['lynch', '你能做的最糟的事，就是投資你一無所知的公司。', 'The worst thing you can do is invest in companies you know nothing about.'],
  ['lynch', '股價常與基本面反向而行，但長期來看，獲利的方向與持續性終將勝出。', 'Stock prices often move in opposite directions from the fundamentals but long term, the direction and sustainability of profits will prevail.'],
  ['lynch', '當你持有優秀公司的股票時，時間站在你這邊。', 'Time is on your side when you own shares of superior companies.'],
  ['lynch', '如果你無法說服自己「跌 25% 時我要買進」，並徹底拋開「跌 25% 時我要賣出」的致命想法，你永遠無法在股市賺到像樣的錢。', 'If you can’t convince yourself “When I’m down 25%, I’m a buyer” and banish forever the fatal thought “When I’m down 25%, I’m a seller,” then you’ll never make a decent profit in stocks.'],
  ['lynch', '沒有人能預測利率、經濟或股市的走向。忽略這些預測，專注於你投資的公司實際發生了什麼。', 'Nobody can predict interest rates, the future direction of the economy, or the stock market. Dismiss all such forecasts and concentrate on what’s actually happening to the companies in which you’ve invested.'],
  ['lynch', '越簡單，我越喜歡。', 'The simpler it is, the better I like it.'],

  ['bogle', '複利報酬的奇蹟，會被複利成本的暴政吞噬。', 'The miracle of compounding returns is overwhelmed by the tyranny of compounding costs.'],
  ['bogle', '投資並沒有看起來那麼難。成功的投資就是做對少數幾件事，並避開嚴重的錯誤。', 'Investing is not nearly as difficult as it looks. Successful investing involves doing a few things right and avoiding serious mistakes.'],
  ['bogle', '股票基金投資人最大的兩個敵人：費用與情緒。', 'The two greatest enemies of the equity fund investor are expenses and emotions.'],
  ['bogle', '長期持有整個股市是贏家的遊戲；試圖打敗市場是輸家的遊戲。', 'Owning the stock market over the long term is a winner’s game. Attempting to beat the market is a loser’s game.'],
  ['bogle', '當一個問題有多種解法時，選擇最簡單的那個。', 'When there are multiple solutions to a problem, choose the simplest one.'],
  ['bogle', '每天學習，尤其要從別人的經驗中學習，這樣比較便宜！', 'Learn every day, but especially from the experiences of others. It’s cheaper!'],

  ['templeton', '在別人絕望拋售時買進、在別人熱切搶購時賣出，需要最大的毅力，也帶來最大的最終回報。', 'To buy when others are despondently selling and to sell when others are avidly buying requires the greatest fortitude and pays the greatest ultimate rewards.'],
  ['templeton', '分散投資。股票和債券就像其他很多事一樣，數量帶來安全。', 'Diversify. In stocks and bonds, as in much else, there is safety in numbers.'],
  ['templeton', '避免犯錯的唯一方法就是不投資——而那正是最大的錯誤。', 'The only way to avoid mistakes is not to invest — which is the biggest mistake of all.'],
  ['templeton', '一個自認什麼答案都有的投資人，其實連問題都不懂。', 'An investor who has all the answers doesn’t even understand the questions.'],

  ['marks', '原則一：大多數事情都會是週期性的。原則二：最大的獲利與虧損機會，出現在人們忘記原則一的時候。', 'Rule No. 1: Most things will prove to be cyclical. Rule No. 2: Some of the greatest opportunities for gain and loss come when other people forget Rule No. 1.'],
  ['marks', '你不能做和別人一樣的事，卻期待表現比別人好。', 'You can’t do the same things others do and expect to outperform.'],
  ['marks', '最大的投資錯誤，不是來自資訊或分析，而是來自心理。', 'The biggest investing errors come not from factors that are informational or analytical, but from those that are psychological.'],
  ['marks', '抗拒群眾、並因此成為成功的逆向投資者，並不容易。', 'Resisting — and thereby achieving success as a contrarian — isn’t easy.'],
  ['marks', '第一層思考說：「這是好公司，買股票吧。」第二層思考說：「這是好公司，但大家都覺得它很棒，所以股價被高估了。」', 'First-level thinking says, “It’s a good company; let’s buy the stock.” Second-level thinking says, “It’s a good company, but everyone thinks it’s a great company, and it’s not. So the stock’s overrated and overpriced; let’s sell.”'],

  ['dalio', '不要把你希望是真的，和真正是真的混為一談。', 'Don’t confuse what you wish were true with what is really true.'],
  ['dalio', '投資人最大的錯誤，是相信最近發生的事很可能會持續下去。', 'The biggest mistake investors make is to believe that what happened in the recent past is likely to persist.'],
  ['dalio', '現金是垃圾。', 'Cash is trash.'],
  ['dalio', '如果你沒有失敗，代表你沒有挑戰自己的極限。', 'If you’re not failing, you’re not pushing your limits.'],

  ['klarman', '投資人應該永遠記住：最重要的指標不是報酬，而是把報酬與承擔的風險放在一起衡量。', 'Investors should always keep in mind that the most important metric is not the returns achieved but the returns weighed against the risks incurred.'],
  ['klarman', '避免虧損，是確保獲利最可靠的方法。', 'The avoidance of loss is the surest way to ensure a profitable outcome.'],
  ['klarman', '大多數投資人主要關注報酬，卻很少注意風險。', 'Most investors are primarily oriented toward return, how much they can make, and pay little attention to risk, how much they can lose.'],

  ['fisher', '我不要一堆不錯的投資，我要少數幾個傑出的投資。', 'I don’t want a lot of good investments; I want a few outstanding ones.'],
  ['fisher', '保守的投資人睡得安穩。', 'Conservative investors sleep well.'],

  ['soros', '我之所以有錢，只是因為我知道自己什麼時候錯了。', 'I’m only rich because I know when I’m wrong.'],
  ['soros', '情況越糟，扭轉它所需要的就越少，上漲空間就越大。', 'The worse a situation becomes, the less it takes to turn it around, and the bigger the upside.'],

  ['taleb', '風會吹熄蠟燭，卻會助長火焰。', 'Wind extinguishes a candle and energizes fire.'],
  ['taleb', '無法預測極端事件，就代表無法預測歷史的走向。', 'The inability to predict outliers implies the inability to predict the course of history.'],

  ['housel', '財富是你看不見的東西。', 'Wealth is what you don’t see.'],
  ['housel', '複利只有在你給資產很多年時間成長時才會發揮作用。', 'Compounding only works if you can give an asset years and years to grow.'],
  ['housel', '賺錢需要承擔風險、保持樂觀、勇於嘗試；但守住錢需要的恰恰相反。', 'Getting money requires taking risks, being optimistic, and putting yourself out there. But keeping money requires the opposite of taking risk.'],

  ['kostolany', '要在股市成功，需要四個 G：金錢、想法、耐心和運氣。', 'To succeed in the stock market you need four G’s: money (Geld), thoughts (Gedanken), patience (Geduld), and luck (Glück).'],

  ['baruch', '從來沒有人因為獲利了結而賠錢。', 'Nobody ever lost money taking a profit.', 1],
  ['baruch', '我賺錢的方法，是賣得太早。', 'I made my money by selling too soon.'],

  ['rogers', '我只是等到牆角有錢躺在那裡，然後走過去把它撿起來。', 'I just wait until there is money lying in the corner, and all I have to do is go over there and pick it up.'],

  ['druckenmiller', '建立長期報酬的方法，是保住本金，再加上幾次全壘打。', 'The way to build long-term returns is through preservation of capital and home runs.'],

  ['ptj', '不要專注在賺錢，專注在保護你已經擁有的。', 'Don’t focus on making money; focus on protecting what you have.'],
  ['ptj', '交易最重要的原則，是打好防守，而不是進攻。', 'The most important rule of trading is to play great defense, not great offense.'],

  ['twain', '十月是投機股票特別危險的月份之一。其他危險的月份還有：七月、一月、九月、四月、十一月、五月、三月、六月、十二月、八月和二月。', 'October: This is one of the peculiarly dangerous months to speculate in stocks in. The others are July, January, September, April, November, May, March, June, December, August, and February.'],
  ['twain', '人生有兩個時候不該投機：負擔不起的時候，以及負擔得起的時候。', 'There are two times in a man’s life when he should not speculate: when he can’t afford it, and when he can.'],

  ['malkiel', '一隻蒙著眼睛的猴子朝報紙財經版射飛鏢選出的投資組合，表現可能和專家精挑細選的一樣好。', 'A blindfolded monkey throwing darts at a newspaper’s financial pages could select a portfolio that would do just as well as one carefully selected by experts.'],

  ['galbraith', '預測者只有兩種：不知道的人，以及不知道自己不知道的人。', 'There are two kinds of forecasters: those who don’t know, and those who don’t know they don’t know.'],

  ['bernstein', '一旦你已經贏了這場遊戲，就不要再拿你真正需要的錢去玩。', 'Once you have won the game, stop playing with the money you really need.'],

  ['zweig', '投資不是要在別人的遊戲裡打敗別人，而是在自己的遊戲裡控制好自己。', 'Investing isn’t about beating others at their game. It’s about controlling yourself at your own game.'],

  ['pabrai', '正面我贏，反面我也輸不多。', 'Heads, I win; tails, I don’t lose much.'],

  ['lilu', '真正的投資風險不是價格的波動，而是本金的永久性損失。', 'The biggest investment risk is not the volatility of prices, but whether you will suffer a permanent loss of capital.'],

  ['greenblatt', '以便宜的價格買進好公司，就是賺大錢的秘訣。', 'Buying good businesses at bargain prices is the secret to making lots of money.'],

  ['kahneman', '我們對自己的盲點視而不見，幾乎不知道自己知道的有多少。', 'We’re blind to our blindness. We have very little idea of how little we know.'],

  ['feynman', '第一原則是：你絕不能欺騙自己——而你正是最容易被騙的人。', 'The first principle is that you must not fool yourself — and you are the easiest person to fool.'],

  ['carnegie', '把所有好蛋放進同一個籃子，然後好好看著那個籃子。', 'Put all good eggs in one basket and then watch that basket.'],

  ['franklin', '早睡早起，使人健康、富有又聰明。', 'Early to bed and early to rise, makes a man healthy, wealthy, and wise.'],

  ['keynes', '世俗的智慧告訴我們，以傳統方式失敗，比以非傳統方式成功，對名聲更有利。', 'Worldly wisdom teaches that it is better for reputation to fail conventionally than to succeed unconventionally.'],

  ['samuelson', '股市預測了過去五次經濟衰退中的九次。', 'The stock market has forecast nine of the last five recessions.'],

  ['livermore', '投機者致命的敵人是：無知、貪婪、恐懼與希望。', 'The speculator’s deadly enemies are: ignorance, greed, fear and hope.'],
  ['livermore', '價格永遠不會高到不能開始買，也不會低到不能開始賣。', 'Prices are never too high to begin buying or too low to begin selling.'],

  ['wallst', '有老的投資人，也有大膽的投資人，但沒有又老又大膽的投資人。', 'There are old investors, and there are bold investors, but there are no old bold investors.'],
  ['wallst', '不要試圖接住一把正在掉落的刀。', 'Don’t try to catch a falling knife.'],
  ['wallst', '趨勢是你的朋友。', 'The trend is your friend.'],
  ['wallst', '牛能賺錢，熊能賺錢，豬只會被宰。', 'Bulls make money, bears make money, pigs get slaughtered.'],

  ['cnproverb', '留得青山在，不怕沒柴燒。', 'As long as the green hills remain, there will be firewood to burn.'],
  ['suntzu', '知己知彼，百戰不殆。', 'Know yourself and know your enemy, and you will never be in peril.'],

  // ── #201–500 ──
  ['buffett', '分散投資是對無知的保護；如果你知道自己在做什麼，它就沒什麼意義。', 'Diversification is protection against ignorance. It makes little sense if you know what you are doing.'],
  ['buffett', '比賽是由專注在球場上的人贏得的，而不是由緊盯著記分板的人。', 'Games are won by players who focus on the playing field, not by those whose eyes are glued to the scoreboard.'],
  ['buffett', '投資不是智商 160 的人一定打敗智商 130 的人的遊戲。', 'Investing is not a game where the guy with the 160 IQ beats the guy with 130 IQ.'],
  ['buffett', '華爾街靠交易活動賺錢，你則靠不動賺錢。', 'Wall Street makes its money on activity. You make your money on inactivity.', 1],
  ['buffett', '當你發現自己掉進洞裡時，最重要的事就是停止挖洞。', 'The most important thing to do if you find yourself in a hole is to stop digging.'],
  ['buffett', '永遠不要用雙腳去測試河水的深度。', 'Never test the depth of the river with both feet.', 1],
  ['buffett', '預測也許能告訴你很多關於預測者的事，卻無法告訴你任何關於未來的事。', 'Forecasts may tell you a great deal about the forecaster; they tell you nothing about the future.'],
  ['buffett', '找人時要看三個特質：正直、聰明與活力；如果缺少第一項，另外兩項會毀了你。', 'In looking for people to hire, you look for three qualities: integrity, intelligence, and energy. And if they don’t have the first, the other two will kill you.'],
  ['buffett', '我們從歷史中學到的，就是人們從不從歷史中學習。', 'What we learn from history is that people don’t learn from history.'],
  ['buffett', '像買房子一樣買股票：了解它、喜歡它，即使沒有市場報價也願意持有。', 'Buy a stock the way you would buy a house. Understand and like it such that you’d be content to own it in the absence of any market.', 1],
  ['buffett', '擁有希望鑽石的一部分，勝過擁有一整顆人造水鑽。', 'It’s better to have a partial interest in the Hope diamond than to own all of a rhinestone.'],
  ['buffett', '小心那些帶著公式來的怪才。', 'Beware of geeks bearing formulas.'],
  ['buffett', '就算讓九個女人同時懷孕，也無法在一個月內生出一個嬰兒。', 'You can’t produce a baby in one month by getting nine women pregnant.'],
  ['buffett', '在過熱市場買進的投資人要明白：即使是傑出的公司，價值也可能要花很長時間才追得上你付出的價格。', 'Investors making purchases in an overheated market need to recognize that it may often take an extended period for the value of even an outstanding company to catch up with the price they paid.'],
  ['buffett', '投資時，恐懼的氛圍是你的朋友；狂熱的世界是你的敵人。', 'A climate of fear is your friend when investing; a euphoric world is your enemy.'],
  ['buffett', '永遠不要做空美國。', 'Never bet against America.'],
  ['buffett', '現金之於企業，就像氧氣之於人：擁有時從不去想，缺少時腦中只剩下它。', 'Cash is to a business as oxygen is to an individual: never thought about when it is present, the only thing in mind when it is absent.'],
  ['buffett', '壞消息是投資人最好的朋友，它讓你能以折扣價買下一部分美國的未來。', 'Bad news is an investor’s best friend. It lets you buy a slice of America’s future at a marked-down price.'],
  ['buffett', '大多數人在大家都感興趣時才對股票感興趣；真正該感興趣的時候，是沒有人感興趣時。', 'Most people get interested in stocks when everyone else is. The time to get interested is when no one else is.'],
  ['buffett', '衍生性金融商品是金融界的大規模毀滅性武器。', 'Derivatives are financial weapons of mass destruction.'],
  ['buffett', '唯有把健全的智力與情緒紀律結合起來，才會有理性的行為。', 'Only when you combine sound intellect with emotional discipline do you get rational behavior.'],
  ['buffett', '黃金從地底挖出來，熔化後再挖個洞把它埋回去；火星人看了一定會抓頭。', 'Gold gets dug out of the ground, then we melt it down, dig another hole, bury it again and pay people to stand around guarding it. Anyone watching from Mars would be scratching their head.'],

  ['munger', '聰明人破產只有三種方式：酒、女人與槓桿。', 'There are three ways a smart person can go broke: liquor, ladies and leverage.'],
  ['munger', '我們看起來像是找到了什麼訣竅，但那不是聰明，只是避免愚蠢。', 'We look like people who have found a trick. It’s not brilliance. It’s just avoiding stupidity.'],
  ['munger', '承認自己的無知，是智慧的開端。', 'Acknowledging what you don’t know is the dawning of wisdom.'],
  ['munger', '第一個十萬美元最難賺，但你必須去做。', 'The first $100,000 is a bitch, but you gotta do it.'],
  ['munger', '你不需要聰明絕頂，只要長期而言平均比別人聰明一點點就夠了。', 'You don’t have to be brilliant, only a little bit wiser than the other guys, on average, for a long, long time.'],
  ['munger', '除非我比對方更了解他的論點，否則我不允許自己對任何事有意見。', 'I never allow myself to have an opinion on anything that I don’t know the other side’s argument better than they do.'],
  ['munger', '我們有三個籃子：可以投資、不投資，以及太難了。', 'We have three baskets: in, out, and too tough.'],
  ['munger', '我不斷看到有些人在人生中步步高升，他們不是最聰明的，但他們是學習機器。', 'I constantly see people rise in life who are not the smartest, sometimes not even the most diligent, but they are learning machines.'],
  ['munger', '我一生中認識的智者，沒有一個不是無時無刻在閱讀的——一個都沒有。', 'In my whole life, I have known no wise people who didn’t read all the time — none, zero.'],
  ['munger', '世界上充滿了愚蠢的賭徒，他們的表現不會比耐心的投資人好。', 'The world is full of foolish gamblers, and they will not do as well as the patient investor.'],
  ['munger', '人們計算得太多，思考得太少。', 'People calculate too much and think too little.'],
  ['munger', '一個人能做的最好的事，就是幫助另一個人知道得更多。', 'The best thing a human being can do is to help another human being know more.'],
  ['munger', '總會有人比你更快致富，這不是悲劇。', 'Someone will always be getting richer faster than you. This is not a tragedy.'],
  ['munger', '嫉妒、怨恨、報復與自憐，都是災難性的思考模式。', 'Generally speaking, envy, resentment, revenge and self-pity are disastrous modes of thought.'],
  ['munger', '很多高智商的人是很糟糕的投資人，因為他們的性情很糟糕。', 'A lot of people with high IQs are terrible investors because they’ve got terrible temperaments.'],
  ['munger', '我們靠的是永遠記住顯而易見的事，而不是去掌握深奧難懂的東西。', 'We try more to profit from always remembering the obvious than from grasping the esoteric.'],

  ['graham', '投資是經過透徹分析，能確保本金安全並獲得適當報酬的操作；不符合這些條件的就是投機。', 'An investment operation is one which, upon thorough analysis, promises safety of principal and an adequate return. Operations not meeting these requirements are speculative.'],
  ['graham', '若要把穩健投資的秘訣濃縮成四個字，那就是：安全邊際。', 'Confronted with a challenge to distill the secret of sound investment into three words, we venture the motto, Margin of Safety.'],
  ['graham', '因為持股出現不合理的下跌就驚慌失措的投資人，等於把自己的基本優勢變成了基本劣勢。', 'The investor who permits himself to be stampeded or unduly worried by unjustified market declines in his holdings is perversely transforming his basic advantage into a basic disadvantage.'],
  ['graham', '真正的投資人如果忘掉股市，專注在股利收入與公司經營成果上，表現會更好。', 'The true investor would do better if he forgot about the stock market and paid attention to his dividend returns and to the operating results of his companies.'],
  ['graham', '企業顯而易見的成長前景，並不會轉化成投資人顯而易見的獲利。', 'Obvious prospects for physical growth in a business do not translate into obvious profits for investors.'],
  ['graham', '對你的知識與經驗要有勇氣。', 'Have the courage of your knowledge and experience.'],
  ['graham', '投機者關心的是預測市場波動並從中獲利；投資人關心的是以合理價格買進並持有合適的證券。', 'The speculator’s primary interest lies in anticipating and profiting from market fluctuations. The investor’s primary interest lies in acquiring and holding suitable securities at suitable prices.'],
  ['graham', '華爾街的人什麼都學不會，卻什麼都忘得掉。', 'Wall Street people learn nothing and forget everything.'],
  ['graham', '認為一般大眾能靠市場預測賺錢，是很荒謬的。', 'It is absurd to think that the general public can ever make money out of market forecasts.'],
  ['graham', '大多數時候，普通股都會出現不理性且過度的雙向價格波動。', 'Most of the time common stocks are subject to irrational and excessive price fluctuations in both directions.'],
  ['graham', '防禦型投資人的首要重點，是避免嚴重的錯誤或損失。', 'The defensive investor will place his chief emphasis on the avoidance of serious mistakes or losses.'],
  ['graham', '古老的傳說中，智者把人世間的歷史濃縮成一句話：「這一切終將過去。」', 'In the old legend the wise men finally boiled down the history of mortal affairs into the single phrase, “This too will pass.”'],

  ['lynch', '如果你花超過 13 分鐘分析經濟與市場預測，你就浪費了 10 分鐘。', 'If you spend more than 13 minutes analyzing economic and market forecasts, you’ve wasted 10 minutes.'],
  ['lynch', '股市要求你有信念，也必然會懲罰沒有信念的人。', 'The stock market demands conviction as surely as it victimizes the unconvinced.'],
  ['lynch', '賣掉賺錢的、留著賠錢的，就像剪掉花朵卻去澆灌雜草。', 'Selling your winners and holding your losers is like cutting the flowers and watering the weeds.'],
  ['lynch', '偏好債券的紳士們，不知道自己錯過了什麼。', 'Gentlemen who prefer bonds don’t know what they’re missing.'],
  ['lynch', '不做研究就投資，就像玩梭哈卻從不看自己的牌。', 'Investing without research is like playing stud poker and never looking at the cards.'],
  ['lynch', '長期來看，精挑細選的股票或股票基金組合，一定會勝過債券或貨幣市場帳戶。', 'In the long run, a portfolio of well-chosen stocks and/or equity mutual funds will always outperform a portfolio of bonds or a money-market account.'],
  ['lynch', '股市下跌就像科羅拉多一月的暴風雪一樣平常；只要有準備，它就傷不了你。', 'A market decline is as routine as a January blizzard in Colorado. If you’re prepared, it can’t hurt you.'],
  ['lynch', '在一檔股票上賠錢並不可恥，可恥的是在基本面惡化時還繼續抱著，甚至加碼。', 'There’s no shame in losing money on a stock. What is shameful is to hold on to a stock, or worse, to buy more of it when the fundamentals are deteriorating.'],
  ['lynch', '一張股票不是一張樂透彩券，而是一家企業的部分所有權。', 'A share is not a lottery ticket. It’s part-ownership of a business.'],
  ['lynch', '最值得買的股票，可能就是你已經持有的那一檔。', 'The best stock to buy may be the one you already own.'],
  ['lynch', '只因為股價便宜就買進前景平庸的公司，是一種必輸的做法。', 'Buying a company with mediocre prospects just because the stock is cheap is a losing technique.'],

  ['bogle', '「市場會響鈴告訴你何時進出」這種想法根本不可信。我在這行近五十年，從沒見過有人能持續成功做到。', 'The idea that a bell rings to signal when investors should get into or out of the stock market is simply not credible. After nearly 50 years in this business, I do not know of anybody who has done it successfully and consistently.'],
  ['bogle', '投資是一種信念的行動：願意延後眼前的消費，為未來儲蓄。', 'Investing is an act of faith, a willingness to postpone present consumption and save for the future.'],
  ['bogle', '買對，然後抱緊。', 'Buy right and hold tight.'],
  ['bogle', '好計畫最大的敵人，是對完美計畫的夢想。', 'The greatest enemy of a good plan is the dream of a perfect plan.'],
  ['bogle', '投資成功一部分靠品格與膽識，一部分靠你能否在狂喜的頂點與絕望的谷底都明白：這一切也將過去。', 'Your success in investing will depend in part on your character and guts, and in part on your ability to realize, at the height of ebullience and the depth of despair alike, that this too, shall pass.'],
  ['bogle', '均值回歸是金融市場的鐵律。', 'Reversion to the mean is the iron rule of the financial markets.'],
  ['bogle', '簡單，是財務成功的萬能鑰匙。', 'Simplicity is the master key to financial success.'],
  ['bogle', '投資人整體不可能打敗市場，因為他們就是市場。', 'Investors as a group cannot outperform the market because they are the market.'],
  ['bogle', '別以為你比市場懂得更多，沒有人是。', 'Don’t think you know more than the market. Nobody does.'],

  ['templeton', '對所有長期投資人來說，目標只有一個：稅後實質總報酬最大化。', 'For all long-term investors, there is only one objective — maximum total real return after taxes.'],
  ['templeton', '如果你買和別人一樣的股票，就會得到和別人一樣的結果。', 'If you buy the same securities as other people, you will have the same results as other people.'],
  ['templeton', '人們總問我哪裡前景好，但這是錯的問題；正確的問題是：哪裡前景最悲慘？', 'People are always asking me where is the outlook good, but that’s the wrong question. The right question is: Where is the outlook most miserable?'],
  ['templeton', '太多投資人關注前景與趨勢，成功的投資人關注的是價值。', 'Too many investors focus on outlook and trend. Successful investors focus on value.'],
  ['templeton', '要投資，不要交易或投機。', 'Invest — don’t trade or speculate.'],
  ['templeton', '對投資的類型要保持彈性與開放的心態。', 'Remain flexible and open-minded about types of investment.'],
  ['templeton', '快樂來自精神上的財富，而不是物質上的財富。', 'Happiness comes from spiritual wealth, not material wealth.'],

  ['marks', '經驗，就是當你沒得到想要的東西時，你所得到的東西。', 'Experience is what you got when you didn’t get what you wanted.'],
  ['marks', '大多數偉大的投資，都始於不舒服的感覺。', 'Most great investments begin in discomfort.'],
  ['marks', '脫離價格來看，沒有所謂好的或壞的投資點子。', 'There’s no such thing as a good or bad idea regardless of price.'],
  ['marks', '投資成功不是來自「買好東西」，而是來自「把東西買好」。', 'Success in investing doesn’t come from “buying good things,” but rather from “buying things well.”'],
  ['marks', '面對未來的關鍵，在於知道自己現在身處何處，即使你無法精確知道要往哪裡去。', 'The key to dealing with the future lies in knowing where you are, even if you can’t know precisely where you’re going.'],
  ['marks', '投資和經濟學一樣，藝術的成分多過科學。', 'Investing, like economics, is more art than science.'],
  ['marks', '長期投資成功的道路，更多是經由風險控制，而不是積極進取。', 'The road to long-term investment success runs through risk control more than through aggressiveness.'],
  ['marks', '懷疑不等於悲觀：樂觀過度時，懷疑要求悲觀；悲觀過度時，懷疑也要求樂觀。', 'Skepticism and pessimism aren’t synonymous. Skepticism calls for pessimism when optimism is excessive. But it also calls for optimism when pessimism is excessive.'],
  ['marks', '耐心的機會主義——等待便宜貨——通常是你最好的策略。', 'Patient opportunism — waiting for bargains — is often your best strategy.'],
  ['marks', '以低於價值的價格買進，在我看來，這就是投資的全部。', 'Buying something for less than its value. In my view, that’s what it’s all about.'],
  ['dimson', '風險意味著：可能發生的事，比實際會發生的事更多。', 'Risk means more things can happen than will happen.'],

  ['dalio', '原則，是成功面對現實、從人生中得到你想要的東西的方法。', 'Principles are ways of successfully dealing with reality to get what you want out of life.'],
  ['dalio', '別擔心看起來好不好，要擔心的是能不能達成目標。', 'Don’t worry about looking good — worry about achieving your goals.'],
  ['dalio', '真相——更精確地說，是對現實的準確理解——是產生好結果的根本基礎。', 'Truth — or, more precisely, an accurate understanding of reality — is the essential foundation for producing good outcomes.'],
  ['dalio', '交易時，你必須同時兼顧防守與進攻。', 'In trading you have to be defensive and aggressive at the same time.'],
  ['dalio', '你幾乎可以擁有任何你想要的東西，但不能擁有所有你想要的東西。', 'You can have virtually anything you want, but you can’t have everything you want.'],
  ['dalio', '我人生中的成功，與其說來自我知道什麼，不如說來自我知道如何面對自己的不知道。', 'Whatever success I’ve had in life has had more to do with my knowing how to deal with my not knowing than anything I know.'],
  ['dalio', '投資的聖杯，是擁有 15 個以上好的、彼此不相關的報酬來源。', 'The holy grail of investing is having 15 or more good, uncorrelated return streams.'],

  ['keynes', '寧可大致正確，也不要精確地錯誤。', 'It is better to be roughly right than precisely wrong.', 1],
  ['keynes', '長期來看，我們都死了。', 'In the long run we are all dead.'],
  ['keynes', '當事實改變時，我就改變想法。那您呢，先生？', 'When the facts change, I change my mind. What do you do, sir?', 1],
  ['keynes', '成功的投資，就是預測別人的預期。', 'Successful investing is anticipating the anticipations of others.', 1],
  ['keynes', '專業投資的社會目的，應該是戰勝籠罩未來的時間與無知這兩股黑暗力量。', 'The social object of skilled investment should be to defeat the dark forces of time and ignorance which envelop our future.'],

  ['klarman', '股市是一部週期的故事，也是一部人性造成雙向過度反應的故事。', 'The stock market is the story of cycles and of the human behavior that is responsible for overreactions in both directions.'],
  ['klarman', '需要安全邊際，是因為估值是一門不精確的藝術、未來無法預測，而投資人是會犯錯的凡人。', 'A margin of safety is necessary because valuation is an imprecise art, the future is unpredictable, and investors are human and do make mistakes.'],
  ['klarman', '投資人能擁有的最大優勢，就是長期導向。', 'The single greatest edge an investor can have is a long-term orientation.'],
  ['klarman', '投資是經濟學與心理學的交會點。', 'Investing is the intersection of economics and psychology.'],

  ['livermore', '是這個遊戲教會了我這個遊戲。', 'The game taught me the game.'],
  ['livermore', '股市從來都不顯而易見，它的設計就是要在大多數時候愚弄大多數人。', 'The stock market is never obvious. It is designed to fool most of the people, most of the time.'],
  ['livermore', '一個人要花很長的時間，才能從自己所有的錯誤中學到所有的教訓。', 'It takes a man a long time to learn all the lessons of all his mistakes.'],
  ['livermore', '謹慎的投機者從不和行情紙帶爭辯。', 'A prudent speculator never argues with the tape.'],
  ['livermore', '股市只有一邊：不是多頭，也不是空頭，而是正確的那一邊。', 'There is only one side of the stock market; and it is not the bull side or the bear side, but the right side.'],

  ['taleb', '最有害的三種成癮：海洛因、碳水化合物和月薪。', 'The three most harmful addictions are heroin, carbohydrates, and a monthly salary.'],
  ['taleb', '反脆弱超越了韌性與強固：有韌性的東西抵抗衝擊、保持原樣；反脆弱的東西則會變得更好。', 'Antifragility is beyond resilience or robustness. The resilient resists shocks and stays the same; the antifragile gets better.'],
  ['taleb', '別問別人的看法、預測或建議，只要問他們的投資組合裡有什麼。', 'Don’t tell me what you think, tell me what you have in your portfolio.'],
  ['taleb', '避免聽從以提供建議為生的人的建議，除非他們的建議錯了要受罰。', 'Avoid taking advice from someone who gives advice for a living, unless there is a penalty for their advice.'],
  ['taleb', '錯過火車只有在你追著它跑時才會痛苦！', 'Missing a train is only painful if you run after it!'],
  ['taleb', '溫和的成功可以用技能與努力解釋；狂野的成功則要歸因於變異。', 'Mild success can be explainable by skills and labor. Wild success is attributable to variance.'],

  ['housel', '花錢向別人炫耀你有多少錢，是讓你錢變少最快的方法。', 'Spending money to show people how much money you have is the fastest way to have less money.'],
  ['housel', '能掌控自己的時間，是金錢所能支付的最高股利。', 'Controlling your time is the highest dividend money pays.'],
  ['housel', '像悲觀者一樣儲蓄，像樂觀者一樣投資。', 'Save like a pessimist and invest like an optimist.'],
  ['housel', '最難的理財技能，是讓目標柱不再移動。', 'The hardest financial skill is getting the goalpost to stop moving.'],
  ['housel', '波動是一筆費用，而不是一張罰單。', 'Volatility is a fee, not a fine.'],
  ['housel', '沒有什麼事像它看起來那麼好，也沒有什麼事像它看起來那麼糟。', 'Nothing is as good or as bad as it seems.'],
  ['housel', '追求大致合理，比追求冷酷的理性更有效。', 'Aiming to be mostly reasonable works better than trying to be coldly rational.'],
  ['housel', '長尾事件主宰一切。', 'Tails drive everything.'],
  ['housel', '犯錯的空間——也就是安全邊際——是金融中最被低估的力量之一。', 'Room for error — often called margin of safety — is one of the most underappreciated forces in finance.'],
  ['housel', '你個人的金錢經驗，可能只佔世界上發生過的事的億分之一，卻佔了你對世界運作認知的八成。', 'Your personal experiences with money make up maybe 0.00000001% of what’s happened in the world, but maybe 80% of how you think the world works.'],

  ['franklin', '省下一分錢，就是賺到一分錢。', 'A penny saved is a penny earned.'],
  ['franklin', '去借錢的人，就是去借憂愁。', 'He that goes a borrowing goes a sorrowing.'],
  ['franklin', '若想致富，除了想著賺錢，也要想著存錢。', 'If you would be wealthy, think of saving as well as getting.'],
  ['franklin', '勤奮是好運之母。', 'Diligence is the mother of good luck.'],
  ['franklin', '債主的記性比欠債的人好。', 'Creditors have better memories than debtors.'],
  ['franklin', '買你不需要的東西，不久你就得賣掉你必需的東西。', 'Buy what thou hast no need of, and ere long thou shalt sell thy necessaries.'],
  ['franklin', '錢能生錢，錢生出來的錢還能再生錢。', 'Money makes money. And the money that money makes, makes money.'],
  ['franklin', '失去的時間，永遠找不回來。', 'Lost time is never found again.'],

  ['kiyosaki', '窮人和中產階級為錢工作，富人讓錢為他們工作。', 'The poor and the middle class work for money. The rich have money work for them.'],
  ['kiyosaki', '資產把錢放進你的口袋，負債把錢從你的口袋拿走。', 'An asset puts money in my pocket. A liability takes money out of my pocket.'],
  ['kiyosaki', '我們每個人擁有的最強大資產，就是我們的頭腦。', 'The single most powerful asset we all have is our mind.'],
  ['kiyosaki', '財務自由屬於那些願意學習它、並為它努力的人。', 'Financial freedom is available to those who learn about it and work for it.'],

  ['ramsey', '預算就是告訴你的錢該去哪裡，而不是事後納悶它去了哪裡。', 'A budget is telling your money where to go instead of wondering where it went.', 1],
  ['ramsey', '現在過別人不願過的生活，將來才能過別人過不起的生活。', 'Live like no one else now, so later you can live like no one else.'],
  ['ramsey', '你無法靠借錢擺脫債務。', 'You can’t borrow your way out of debt.'],
  ['ramsey', '你的收入，是你累積財富最強大的工具。', 'Your income is your most powerful wealth-building tool.'],
  ['ramsey', '個人理財 80% 是行為，只有 20% 是知識。', 'Personal finance is 80% behavior and only 20% head knowledge.'],

  ['kostolany', '錢多的人可以投機；錢少的人不應該投機；沒錢的人必須投機。', 'Whoever has a lot of money can speculate; whoever has little money should not speculate; whoever has no money must speculate.'],
  ['kostolany', '股市的反應，九成是心理因素。', 'The stock market reacts ninety percent psychologically.'],
  ['kostolany', '股票下跌時手上沒有股票的人，上漲時手上也不會有。', 'Whoever doesn’t have stocks when they fall won’t have them when they rise either.'],
  ['kostolany', '先有痛苦，然後才有補償。', 'First comes the pain, then the compensation.'],

  ['rogers', '關於投資最好的一條規則，就是什麼都不做，除非真的有事可做。', 'One of the best rules anybody can learn about investing is to do nothing, absolutely nothing, unless there is something to do.'],
  ['rogers', '我從沒見過有錢的技術分析師。', 'I haven’t met a rich technician.'],
  ['druckenmiller', '永遠、永遠不要投資在「現在」。', 'Never, ever invest in the present.'],
  ['druckenmiller', '驅動整體市場的不是企業獲利，而是聯準會。', 'Earnings don’t move the overall market; it’s the Federal Reserve Board.'],
  ['ptj', '只有輸家才會攤平虧損。', 'Losers average losers.'],
  ['ptj', '不要當英雄，不要有自我。', 'Don’t be a hero. Don’t have an ego.'],
  ['ptj', '我相信最好賺的錢，都在市場轉折點。', 'I believe the very best money is made at the market turns.'],

  ['twain', '歷史不會重演，但常常押韻。', 'History doesn’t repeat itself, but it often rhymes.', 1],
  ['twain', '買土地吧，他們已經不再生產土地了。', 'Buy land, they’re not making it anymore.', 1],
  ['twain', '每當你發現自己站在多數人那一邊，就該停下來好好反思。', 'Whenever you find yourself on the side of the majority, it is time to pause and reflect.'],
  ['willrogers', '比起我的錢能賺多少報酬，我更在乎我的錢能不能回來。', 'I am more concerned about the return of my money than the return on my money.'],
  ['willrogers', '我們用自己沒有的錢，買自己不需要的東西，去討好自己不喜歡的人。', 'Too many people spend money they haven’t earned, to buy things they don’t want, to impress people they don’t like.', 1],
  ['willrogers', '別賭博。把積蓄拿去買好股票，等它漲了再賣。如果它不會漲，那就別買。', 'Don’t gamble; take all your savings and buy some good stock and hold it till it goes up, then sell it. If it don’t go up, don’t buy it.'],

  ['malkiel', '市場不一定總是對的，但沒有任何個人或機構能持續比市場懂得更多。', 'The market is not always or even usually correct. But no one person or institution consistently knows more than the market.'],
  ['malkiel', '投資組合的核心，應該是低成本、節稅、廣泛分散的指數基金。', 'The core of your investment portfolio should be low-cost, tax-efficient, broad-based index funds.'],
  ['galbraith', '經濟預測唯一的功能，就是讓占星術看起來體面一點。', 'The only function of economic forecasting is to make astrology look respectable.', 1],
  ['galbraith', '金融天才，總是出現在崩盤之前。', 'Financial genius is before the fall.'],
  ['galbraith', '金融界一次又一次地歡呼輪子的發明，而且往往是稍微更不穩定的版本。', 'The world of finance hails the invention of the wheel over and over again, often in a slightly more unstable version.'],
  ['zweig', '聰明的投資人對大型成長股感興趣，不是在它們最熱門的時候，而是在它們出問題的時候。', 'The intelligent investor gets interested in big growth stocks not when they are at their most popular — but when something goes wrong.'],
  ['pabrai', '少量下注、大額下注、不頻繁下注。', 'Few bets, big bets, infrequent bets.'],
  ['pabrai', '要找的是低風險、高不確定性的生意。', 'Dhandho investors seek low-risk, high-uncertainty businesses.'],
  ['pabrai', '我是一個毫不羞愧的複製者。', 'I’m a shameless cloner.'],
  ['greenblatt', '不知道自己在找什麼就挑選個股，就像拿著點燃的火柴跑過炸藥工廠——你也許能活下來，但你仍然是個傻瓜。', 'Choosing individual stocks without any idea of what you’re looking for is like running through a dynamite factory with a burning match. You may live, but you’re still an idiot.'],
  ['greenblatt', '做投資決策時，先往下看，而不是往上看；只要不賠錢，剩下的選擇大多都是好的。', 'Look down, not up, when making your initial investment decision. If you don’t lose money, most of the remaining alternatives are good ones.'],

  ['kahneman', '當你正在想某件事時，它都不會像你以為的那麼重要。', 'Nothing in life is as important as you think it is, while you are thinking about it.'],
  ['kahneman', '損失帶來的感受，比同等獲利更強烈。', 'Losses loom larger than gains.'],
  ['kahneman', '「我們理解過去」的錯覺，助長了我們對預測未來能力的過度自信。', 'The illusion that we understand the past fosters overconfidence in our ability to predict the future.'],
  ['kahneman', '讓人相信謊言最可靠的方法就是不斷重複，因為熟悉感很難與真相區分。', 'A reliable way to make people believe in falsehoods is frequent repetition, because familiarity is not easily distinguished from truth.'],
  ['feynman', '我很早就學到：知道一樣東西的名字，和真正了解它，是兩回事。', 'I learned very early the difference between knowing the name of something and knowing something.'],
  ['carnegie', '富有地死去，是一種恥辱。', 'The man who dies rich dies disgraced.'],
  ['carnegie', '盯好成本，利潤自然會照顧好自己。', 'Watch the costs and the profits will take care of themselves.'],
  ['einstein', '世界上最難理解的東西，是所得稅。', 'The hardest thing in the world to understand is the income tax.', 1],

  ['baruch', '別想在最低點買進、在最高點賣出，除了騙子，沒有人做得到。', 'Don’t try to buy at the bottom and sell at the top. It can’t be done except by liars.'],
  ['baruch', '股市的主要目的，就是讓盡可能多的人變成傻瓜。', 'The main purpose of the stock market is to make fools of as many men as possible.'],
  ['baruch', '每個人都有權擁有自己的意見，但沒有人有權弄錯事實。', 'Every man has a right to his opinion, but no man has a right to be wrong in his facts.'],
  ['soros', '如果投資讓你覺得很好玩，你大概沒在賺錢。好的投資是無聊的。', 'If investing is entertaining, if you’re having fun, you’re probably not making any money. Good investing is boring.'],
  ['soros', '當一隻豬需要勇氣。', 'It takes courage to be a pig.'],
  ['soros', '一旦明白不完美的理解是人類的常態，犯錯就不可恥，可恥的是不改正錯誤。', 'Once we realize that imperfect understanding is the human condition, there is no shame in being wrong, only in failing to correct our mistakes.'],
  ['soros', '金融市場通常無法預測，所以你必須準備好不同的情境。', 'The financial markets generally are unpredictable. So that one has to have different scenarios.'],
  ['fisher', '做大家此刻都在做的事——也就是你幾乎無法抗拒想做的事——往往是錯的。', 'Doing what everybody else is doing at the moment, and therefore what you have an almost irresistible urge to do, is often the wrong thing to do.'],
  ['fisher', '投資人為了「至少打平再賣」而抱著不想要的股票，損失的錢可能比任何其他原因都多。', 'More money has probably been lost by investors holding a stock they really did not want until they could “at least come out even” than from any other single reason.'],
  ['fisher', '成功的投資人，通常天生就對企業經營的問題感興趣。', 'The successful investor is usually an individual who is inherently interested in business problems.'],

  ['bible', '貪財是萬惡之根。', 'The love of money is the root of all evil.'],
  ['bible', '你要分給七人，或分給八人，因為你不知道將來有什麼災禍臨到地上。', 'Give a portion to seven, and also to eight; for thou knowest not what evil shall be upon the earth.'],
  ['bible', '不勞而得之財必然消耗；勤勞積蓄的，必見加增。', 'Dishonest money dwindles away, but whoever gathers money little by little makes it grow.'],
  ['bible', '殷勤籌劃的，足致豐裕；行事急躁的，都必缺乏。', 'The plans of the diligent lead to profit as surely as haste leads to poverty.'],
  ['bible', '懶惰人哪，你去察看螞蟻的動作，就可得智慧。', 'Go to the ant, thou sluggard; consider her ways, and be wise.'],

  ['proverb', '傻瓜和他的錢很快就會分開。', 'A fool and his money are soon parted.'],
  ['proverb', '不浪費，就不匱乏。', 'Waste not, want not.'],
  ['proverb', '蛋還沒孵出來，別急著數小雞。', 'Don’t count your chickens before they hatch.'],
  ['proverb', '天下沒有白吃的午餐。', 'There’s no such thing as a free lunch.'],
  ['proverb', '如果聽起來好得不像真的，那它大概就不是真的。', 'If it sounds too good to be true, it probably is.'],
  ['proverb', '錢不是從樹上長出來的。', 'Money doesn’t grow on trees.'],
  ['proverb', '一鳥在手，勝過二鳥在林。', 'A bird in the hand is worth two in the bush.'],

  ['wallst', '股票不知道你持有它。', 'A stock doesn’t know you own it.', 1],
  ['wallst', '牛市總是在憂慮之牆上攀爬。', 'Bull markets climb a wall of worry.'],
  ['wallst', '重要的是待在市場裡的時間，而不是擇時進出。', 'Time in the market beats timing the market.'],
  ['wallst', '別把多頭市場誤當成自己的聰明。', 'Don’t confuse brains with a bull market.'],
  ['wallst', '五月賣出，然後離場。', 'Sell in May and go away.'],
  ['wallst', '謠言時買進，消息出來時賣出。', 'Buy the rumor, sell the news.'],
  ['wallst', '市場上漲走樓梯，下跌搭電梯。', 'Markets take the stairs up and the elevator down.'],
  ['wallst', '不要和聯準會作對。', 'Don’t fight the Fed.'],
  ['wallst', '截斷虧損，讓利潤奔跑。', 'Cut your losses short and let your profits run.'],
  ['wallst', '沒有人會在頭部敲鐘提醒你。', 'Nobody rings a bell at the top.'],
  ['wallst', '低買高賣。', 'Buy low, sell high.'],
  ['wallst', '計畫你的交易，然後照計畫交易。', 'Plan the trade and trade the plan.'],
  ['rothschild', '在街頭血流成河時買進，即使那是你自己的血。', 'Buy when there’s blood in the streets, even if the blood is your own.', 1],

  ['cnproverb', '你不理財，財不理你。', 'If you don’t manage your money, your money won’t take care of you.'],
  ['cnproverb', '積少成多。', 'Many a little makes a mickle.'],
  ['cnproverb', '聚沙成塔。', 'Grains of sand, gathered together, become a pagoda.'],
  ['cnproverb', '滴水穿石。', 'Constant dripping wears away the stone.'],
  ['cnproverb', '開源節流。', 'Broaden the sources of income and reduce expenditure.'],
  ['cnproverb', '貪小便宜吃大虧。', 'Grab at small bargains and you’ll suffer big losses.'],
  ['cnproverb', '塞翁失馬，焉知非福。', 'The old man lost his horse — who knows whether it is not a blessing?'],
  ['cnproverb', '羊毛出在羊身上。', 'The wool comes from the sheep’s own back.'],
  ['cnproverb', '錢要花在刀口上。', 'Spend money where it counts most.'],
  ['cnproverb', '未雨綢繆。', 'Mend the roof before it rains.'],
  ['cnproverb', '量入為出。', 'Live within your means.'],
  ['cnproverb', '不怕慢，只怕站。', 'Fear not going slowly; fear only standing still.'],
  ['cnproverb', '富不過三代。', 'Wealth does not last beyond three generations.'],
  ['cnproverb', '吃不窮，穿不窮，算計不到一世窮。', 'Eating won’t make you poor, nor will clothing; failing to plan keeps you poor for life.'],
  ['cnproverb', '家有千金，不如日進分文。', 'A fortune at home is worth less than a steady trickle of daily income.'],
  ['cnproverb', '臨渴掘井，為時已晚。', 'Digging a well only when you are thirsty is already too late.'],
  ['simaguang', '由儉入奢易，由奢入儉難。', 'It is easy to go from frugality to extravagance, but hard to go from extravagance back to frugality.'],
  ['simaguang', '儉，德之共也；侈，惡之大也。', 'Frugality is the common ground of all virtues; extravagance is the greatest of vices.'],

  ['analects', '欲速則不達，見小利則大事不成。', 'Haste leads to failure; chasing small gains prevents great achievements.'],
  ['analects', '人無遠慮，必有近憂。', 'He who gives no thought to far-off difficulties will soon face troubles near at hand.'],
  ['analects', '不義而富且貴，於我如浮雲。', 'Riches and honors acquired by unrighteousness are to me as a floating cloud.'],
  ['analects', '知之為知之，不知為不知，是知也。', 'To know what you know and to know what you do not know — that is true knowledge.'],
  ['analects', '君子喻於義，小人喻於利。', 'The gentleman understands what is right; the petty man understands what is profitable.'],
  ['analects', '過猶不及。', 'To go too far is as bad as to fall short.'],
  ['analects', '三人行，必有我師焉。', 'When three walk together, one of them can surely be my teacher.'],
  ['analects', '學而不思則罔，思而不學則殆。', 'Learning without thought is labor lost; thought without learning is perilous.'],
  ['analects', '工欲善其事，必先利其器。', 'A craftsman who wishes to do his work well must first sharpen his tools.'],
  ['analects', '過而不改，是謂過矣。', 'To make a mistake and not correct it — that is the real mistake.'],

  ['laozi', '知足不辱，知止不殆，可以長久。', 'Know contentment and you will suffer no disgrace; know when to stop and you will meet no danger; thus you can long endure.'],
  ['laozi', '千里之行，始於足下。', 'A journey of a thousand miles begins with a single step.'],
  ['laozi', '合抱之木，生於毫末；九層之臺，起於累土。', 'A tree too wide to embrace grows from a tiny sprout; a tower of nine stories rises from a heap of earth.'],
  ['laozi', '禍莫大於不知足，咎莫大於欲得。', 'There is no calamity greater than not knowing contentment; no fault greater than the desire to acquire.'],
  ['laozi', '知人者智，自知者明。', 'He who knows others is wise; he who knows himself is enlightened.'],
  ['laozi', '圖難於其易，為大於其細。', 'Tackle the difficult while it is still easy; achieve the great through the small.'],
  ['laozi', '禍兮福之所倚，福兮禍之所伏。', 'Misfortune is where fortune rests; fortune is where misfortune hides.'],
  ['laozi', '甚愛必大費，多藏必厚亡。', 'Excessive love of things brings great expense; much hoarding brings heavy loss.'],
  ['laozi', '持而盈之，不如其已。', 'Filling a vessel to the brim is not as good as stopping in time.'],

  ['mencius', '生於憂患，死於安樂。', 'We survive through adversity and perish through ease and comfort.'],
  ['mencius', '有恆產者有恆心。', 'Those with steady property have steady hearts.'],
  ['mencius', '盡信書，則不如無書。', 'To believe everything in books is worse than having no books at all.'],
  ['xunzi', '不積跬步，無以至千里；不積小流，無以成江海。', 'Without accumulating small steps, one cannot travel a thousand miles; without accumulating small streams, there can be no rivers and seas.'],
  ['xunzi', '鍥而不舍，金石可鏤。', 'Carve without stopping, and even metal and stone can be engraved.'],
  ['xunzi', '彊本而節用，則天不能貧。', 'Strengthen the foundation and spend frugally, and Heaven itself cannot make you poor.'],
  ['hanfei', '千丈之堤，以螻蟻之穴潰。', 'A dike a thousand feet long can collapse through an ant’s hole.'],
  ['hanfei', '長袖善舞，多錢善賈。', 'Long sleeves make for good dancing; ample capital makes for good trading.'],
  ['yijing', '君子以思患而豫防之。', 'The superior man thinks of misfortune and guards against it in advance.'],
  ['yijing', '亢龍有悔。', 'The arrogant dragon will have cause to repent.'],
  ['yijing', '窮則變，變則通，通則久。', 'When a thing reaches its limit, it changes; change brings a way through; a way through brings endurance.'],

  ['shiji', '天下熙熙，皆為利來；天下攘攘，皆為利往。', 'The whole world bustles, all coming for profit; the whole world jostles, all going for profit.'],
  ['shiji', '貴出如糞土，賤取如珠玉。', 'When prices are high, sell as if discarding dirt; when prices are low, buy as if acquiring pearls and jade.'],
  ['shiji', '人棄我取，人取我與。', 'What others discard, I take; what others take, I give.'],
  ['shiji', '旱則資舟，水則資車。', 'In times of drought, invest in boats; in times of flood, invest in carts.'],
  ['shiji', '貴上極則反賤，賤下極則反貴。', 'When prices rise to the extreme they turn cheap; when they fall to the extreme they turn dear.'],
  ['suntzu', '勝兵先勝而後求戰，敗兵先戰而後求勝。', 'The victorious army wins first and then seeks battle; the defeated army fights first and then seeks victory.'],
  ['suntzu', '昔之善戰者，先為不可勝，以待敵之可勝。', 'The skillful warriors of old first made themselves invincible, then waited for the enemy to become vulnerable.'],
  ['suntzu', '多算勝，少算不勝。', 'More calculation brings victory; less calculation brings defeat.'],
  ['suntzu', '兵無常勢，水無常形。', 'Just as water has no constant shape, in war there are no constant conditions.'],

  ['seneca', '貧窮的不是擁有太少的人，而是渴求更多的人。', 'It is not the man who has too little, but the man who craves more, who is poor.'],
  ['seneca', '運氣，就是準備遇上機會。', 'Luck is what happens when preparation meets opportunity.', 1],
  ['seneca', '我們在想像中受的苦，比在現實中更多。', 'We suffer more often in imagination than in reality.'],
  ['seneca', '財富是智者的奴隸，愚者的主人。', 'Wealth is the slave of a wise man, the master of a fool.'],
  ['seneca', '當我們一再拖延，生命已飛逝而過。', 'While we are postponing, life speeds by.'],
  ['epictetus', '財富不在於擁有很多，而在於需求很少。', 'Wealth consists not in having great possessions, but in having few wants.'],
  ['epictetus', '重要的不是發生了什麼，而是你如何回應。', 'It’s not what happens to you, but how you react to it that matters.'],

  ['greenspan', '非理性繁榮。', 'Irrational exuberance.'],
  ['greenspan', '歷史從未善待長期低風險溢價之後的局面。', 'History has not dealt kindly with the aftermath of protracted periods of low risk premiums.'],
  ['icahn', '人生和商場上有兩大罪過：一是不經思考就貿然行動，二是完全不行動。', 'In life and business, there are two cardinal sins. The first is to act precipitously without thought, and the second is to not act at all.'],
  ['davis', '大部分的錢其實是在熊市中賺到的，只是你當下沒有意識到。', 'You make most of your money in a bear market, you just don’t realize it at the time.'],
  ['ellis', '在輸家的遊戲裡，結果是由錯誤決定的；贏家是犯錯最少的人。', 'In a loser’s game, the outcome is determined by mistakes; the winner is the one who makes fewer of them.'],
  ['seykota', '無論輸贏，每個人都從市場得到了他想要的東西。', 'Win or lose, everybody gets what they want out of the market.'],
  ['seykota', '好交易的要素：一、停損；二、停損；三、停損。', 'The elements of good trading are: (1) cutting losses, (2) cutting losses, and (3) cutting losses.'],
  ['tsmith', '買好公司，別付太多，然後什麼都不做。', 'Buy good companies. Don’t overpay. Do nothing.'],
  ['schloss', '盡量以折價買進資產，而不是買進盈餘。', 'Try to buy assets at a discount than to buy earnings.'],
  ['schloss', '別讓情緒影響你的判斷。', 'Don’t let your emotions affect your judgment.'],
  ['billmiller', '平均成本最低者勝。', 'The lowest average cost wins.'],
  ['irvingfisher', '股價已經達到一個看似永久的高原。', 'Stock prices have reached what looks like a permanently high plateau.'],
  ['newton', '我能計算天體的運行，卻無法計算人性的瘋狂。', 'I can calculate the motion of heavenly bodies, but not the madness of people.', 1],
  ['jefferson', '錢還沒賺到手之前，絕不要先花掉。', 'Never spend your money before you have it.'],
  ['jefferson', '別因為便宜就買你不想要的東西，那對你來說其實很貴。', 'Never buy what you do not want because it is cheap; it will be dear to you.'],
  ['ford', '金錢就像手臂或腿——不用就會失去。', 'Money is like an arm or a leg — use it or lose it.'],
  ['ford', '一個人在這世上唯一真正的保障，是知識、經驗與能力的儲備。', 'The only real security that a man will have in this world is a reserve of knowledge, experience, and ability.'],
  ['shaw', '缺錢才是萬惡之源。', 'The lack of money is the root of all evil.'],
  ['orman', '先是人，然後是錢，最後才是東西。', 'People first, then money, then things.'],
  ['friedman', '通貨膨脹無論何時何地，都是一種貨幣現象。', 'Inflation is always and everywhere a monetary phenomenon.'],
  ['friedman', '沒有人花別人的錢，會像花自己的錢一樣小心。', 'Nobody spends somebody else’s money as carefully as he spends his own.'],
  ['adamsmith', '我們能有晚餐吃，不是出於屠夫、釀酒師或麵包師的仁慈，而是出於他們對自身利益的關心。', 'It is not from the benevolence of the butcher, the brewer, or the baker that we expect our dinner, but from their regard to their own interest.'],
  ['adamsmith', '每個揮霍者似乎都是公眾的敵人，每個節儉者都是公眾的恩人。', 'Every prodigal appears to be a public enemy, and every frugal man a public benefactor.'],

  // ── #501–600：夠了、心態、喜悅、花錢的藝術 Enough · mindset · joy · the art of spending ──
  ['vonnegut', '我擁有一樣他永遠得不到的東西：知道自己已經夠了。', 'I’ve got something he can never have … the knowledge that I’ve got enough.'],
  ['bogle', '太多成本，太少價值。', 'Too much cost, not enough value.'],
  ['bogle', '太多投機，太少投資。', 'Too much speculation, not enough investment.'],
  ['bogle', '太多複雜，太少簡單。', 'Too much complexity, not enough simplicity.'],
  ['bogle', '太多計算，太少信任。', 'Too much counting, not enough trust.'],
  ['bogle', '太多推銷，太少受託管理。', 'Too much salesmanship, not enough stewardship.'],
  ['bogle', '太多專注於物質，太少專注於承諾。', 'Too much focus on things, not enough focus on commitment.'],
  ['bogle', '太多「成功」，太少品格。', 'Too much “success,” not enough character.'],
  ['bogle', '堅持到底。無論發生什麼事，都要堅守你的計畫。', 'Stay the course. No matter what happens, stick to your program.'],
  ['cameron', '不是所有重要的東西都能被計算，也不是所有能被計算的東西都重要。', 'Not everything that counts can be counted, and not everything that can be counted counts.'],

  ['housel', '沒有人會像你自己一樣，對你擁有的東西印象深刻。', 'No one is as impressed with your possessions as you are.'],
  ['housel', '現代資本主義擅長兩件事：創造財富，以及製造嫉妒。', 'Modern capitalism is a pro at two things: generating wealth and generating envy.'],
  ['housel', '每個計畫最重要的部分，是預先規劃「計畫不會照計畫走」。', 'The most important part of every plan is planning on your plan not going according to plan.'],
  ['housel', '少一點自我，多一點財富。', 'Less ego, more wealth.'],
  ['housel', '無論收入高低，獨立取決於你的儲蓄率。', 'Independence, at any income level, is driven by your savings rate.'],
  ['housel', '收入超過某個水準之後，你真正需要的，只是低於你自尊心的那部分。', 'Past a certain level of income, what you need is just what sits below your ego.'],
  ['housel', '「夠了」是明白：相反的那一面——對更多永不滿足的胃口——終將把你推向後悔。', 'Enough is realizing that the opposite — an insatiable appetite for more — will push you to the point of regret.'],
  ['housel', '最高形式的財富，是每天早上醒來都能說：「今天我想做什麼就做什麼。」', 'The highest form of wealth is the ability to wake up every morning and say, “I can do whatever I want today.”'],
  ['housel', '快樂 = 結果 − 期望。', 'Happiness is results minus expectations.', 1],

  ['buffett', '為了賺他們沒有也不需要的錢，他們拿自己擁有且需要的東西去冒險。這很愚蠢。', 'To make money they didn’t have and didn’t need, they risked what they did have and did need. That’s foolish.'],
  ['buffett', '到了我這個年紀，你衡量人生成功的標準，是那些你希望愛你的人，有多少真的愛你。', 'When you get to my age, you’ll really measure your success in life by how many of the people you want to have love you actually do love you.'],
  ['buffett', '我每天都是跳著踢踏舞去上班的。', 'I tap dance to work every day.'],
  ['buffett', '不論是襪子還是股票，我都喜歡在優質商品打折時買進。', 'Whether we’re talking about socks or stocks, I like buying quality merchandise when it is marked down.'],
  ['buffett', '我買的西裝很貴，只是穿在我身上看起來很便宜。', 'I buy expensive suits. They just look cheap on me.'],
  ['buffett', '如果你屬於全人類最幸運的 1%，你就有責任為其他 99% 的人著想。', 'If you’re in the luckiest 1 per cent of humanity, you owe it to the rest of humanity to think about the other 99 per cent.'],

  ['munger', '快樂人生的第一條規則：降低期望。', 'The first rule of a happy life is low expectations.'],
  ['munger', '嫉妒是很愚蠢的罪，因為它是唯一一種你完全無法從中得到樂趣的罪。', 'Envy is a really stupid sin because it’s the only one you could never possibly have any fun at.'],
  ['munger', '我並不打算變得富有，我只是想要獨立。', 'I did not intend to get rich. I just wanted to get independent.'],
  ['munger', '老年最好的盔甲，是在那之前過得充實的一生。', 'The best armor of old age is a well-spent life preceding it.'],
  ['templeton', '追逐快樂，快樂會躲開；給予快樂，快樂會回來。', 'Happiness pursued, eludes; happiness given, returns.', 1],

  ['franklin', '知足使窮人富有，不知足使富人貧窮。', 'Content makes poor men rich; discontent makes rich men poor.'],
  ['franklin', '誰是富人？知足的人。那是誰？沒有人。', 'Who is rich? He that is content. Who is that? Nobody.'],
  ['franklin', '如果你懂得花得比賺得少，你就擁有了點金石。', 'If you know how to spend less than you get, you have the philosopher’s stone.'],
  ['franklin', '金錢從未讓人快樂，將來也不會。一個人擁有越多，想要的就越多。', 'Money never made a man happy yet, nor will it. The more a man has, the more he wants.', 1],

  ['epicurus', '不要因渴望你沒有的東西，而糟蹋了你擁有的；記住，你現在擁有的，曾經也是你只能盼望的。', 'Do not spoil what you have by desiring what you have not; remember that what you now have was once among the things you only hoped for.'],
  ['epicurus', '對嫌「足夠」太少的人來說，什麼都不夠。', 'Nothing is enough for the man to whom enough is too little.'],
  ['epicurus', '智慧帶給我們幸福的一切之中，最重要的就是友誼。', 'Of all the things which wisdom provides to make us entirely happy, much the greatest is the possession of friendship.'],
  ['socrates', '不滿足於已擁有的人，即使得到想要的，也不會滿足。', 'He who is not contented with what he has, would not be contented with what he would like to have.', 1],
  ['socrates', '知足是天然的財富，奢華是人為的貧窮。', 'Contentment is natural wealth; luxury is artificial poverty.', 1],
  ['marcus', '幸福的人生所需甚少；一切都在你自己身上，在你的思考方式裡。', 'Very little is needed to make a happy life; it is all within yourself, in your way of thinking.'],
  ['marcus', '你人生的幸福，取決於你思想的品質。', 'The happiness of your life depends upon the quality of your thoughts.', 1],
  ['marcus', '你能掌控的是你的心，而不是外在事件。明白這點，你就會找到力量。', 'You have power over your mind — not outside events. Realize this, and you will find strength.', 1],
  ['seneca', '只要懂得如何運用，人生就很長。', 'Life is long if you know how to use it.'],
  ['seneca', '立刻開始生活，把每一天都當作獨立的一生。', 'Begin at once to live, and count each separate day as a separate life.'],
  ['seneca', '真正的幸福，是享受當下，而不焦慮地依賴未來。', 'True happiness is to enjoy the present, without anxious dependence upon the future.', 1],
  ['epictetus', '不為自己沒有的東西悲傷，而為自己擁有的東西歡喜，才是智者。', 'He is a wise man who does not grieve for the things which he has not, but rejoices for those which he has.'],
  ['epictetus', '自由不是靠盡情享受所欲之物得來，而是靠節制慾望。', 'Freedom is not procured by a full enjoyment of what is desired, but by controlling the desire.'],
  ['horace', '把握今天，盡量少寄望於明天。', 'Seize the day, trusting as little as possible in tomorrow.'],
  ['aristotle', '幸福取決於我們自己。', 'Happiness depends upon ourselves.', 1],
  ['mill', '一旦問自己是否快樂，你就不再快樂了。', 'Ask yourself whether you are happy, and you cease to be so.'],

  ['thoreau', '一個人富有的程度，與他能夠不去在乎的東西數量成正比。', 'A man is rich in proportion to the number of things which he can afford to let alone.'],
  ['thoreau', '一樣東西的代價，是你必須用來交換它的生命——無論是立即付出還是長期付出。', 'The cost of a thing is the amount of what I will call life which is required to be exchanged for it, immediately or in the long run.'],
  ['thoreau', '我們的生命被瑣事消耗殆盡。簡化，再簡化。', 'Our life is frittered away by detail. Simplify, simplify.'],
  ['thoreau', '樂趣最便宜的人，才是最富有的人。', 'That man is the richest whose pleasures are the cheapest.'],
  ['robin', '金錢是我們選擇用生命能量去交換的東西。', 'Money is something we choose to trade our life energy for.'],
  ['stanley', '財富不等於收入。每年收入很高卻全部花光，你並沒有變得更富有，只是過得很闊氣。', 'Wealth is not the same as income. If you make a good income each year and spend it all, you are not getting wealthier. You are just living high.'],
  ['stanley', '（真正的百萬富翁）他們的生活水準，遠低於他們的財力。', 'They live well below their means.'],
  ['collins', '花得比賺得少——把多餘的錢拿去投資——避免負債。', 'Spend less than you earn — invest the surplus — avoid debt.'],
  ['collins', '金錢能買很多東西，但沒有什麼比你的自由更有價值。', 'Money can buy many things, but nothing more valuable than your freedom.'],
  ['sethi', '在你熱愛的事物上大方花錢，在你不在乎的事物上毫不留情地省錢。', 'Spend extravagantly on the things you love, and cut costs mercilessly on the things you don’t.'],
  ['dickens', '年收入二十鎊，年支出十九鎊十九先令六便士，結果是幸福；年收入二十鎊，年支出二十鎊零六便士，結果是痛苦。', 'Annual income twenty pounds, annual expenditure nineteen nineteen and six, result happiness. Annual income twenty pounds, annual expenditure twenty pounds ought and six, result misery.'],
  ['avot', '誰是富有的人？是為自己所得而歡喜的人。', 'Who is rich? One who rejoices in his portion.'],
  ['troosevelt', '比較是偷走喜悅的小偷。', 'Comparison is the thief of joy.', 1],
  ['maggiulli', '持續買進就對了。', 'Just keep buying.'],
  ['orman', '財務自由很大一部分，是讓你的心和腦，不再為人生的各種「萬一」而擔憂。', 'A big part of financial freedom is having your heart and mind free from worry about the what-ifs of life.'],
  ['perkins', '死時歸零：把錢化為活著時的經歷，而不是留下用不到的數字。', 'Die with zero.'],

  ['bible', '人若賺得全世界，賠上自己的生命，有什麼益處呢？', 'What shall it profit a man, if he shall gain the whole world, and lose his own soul?'],
  ['bible', '只要有衣有食，就當知足。', 'Having food and raiment let us be therewith content.'],
  ['bible', '貪愛銀子的，不因得銀子知足。', 'He that loveth silver shall not be satisfied with silver.'],
  ['bible', '滿了一把，得享安靜，強如滿了兩把，勞碌捕風。', 'Better is an handful with quietness, than both the hands full with travail and vexation of spirit.'],
  ['proverb', '金錢買不到快樂。', 'Money can’t buy happiness.'],
  ['proverb', '足夠就如同盛宴。', 'Enough is as good as a feast.'],
  ['proverb', '人生最美好的東西都是免費的。', 'The best things in life are free.'],
  ['proverb', '壽衣上沒有口袋。', 'There are no pockets in a shroud.'],
  ['proverb', '數算你所擁有的福分。', 'Count your blessings.'],

  ['laozi', '知足者富，強行者有志。', 'He who knows contentment is rich; he who perseveres has purpose.'],
  ['laozi', '故知足之足，常足矣。', 'Thus the contentment of knowing enough is lasting contentment.'],
  ['laozi', '少則得，多則惑。', 'With little, one gains; with much, one is confused.'],
  ['laozi', '五色令人目盲，五音令人耳聾。', 'The five colors blind the eye; the five tones deafen the ear.'],
  ['analects', '飯疏食飲水，曲肱而枕之，樂亦在其中矣。', 'Eating coarse rice, drinking water, using my bent arm for a pillow — there is joy in this too.'],
  ['analects', '一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。', 'A bowl of rice, a ladle of water, living in a mean alley — others could not bear the hardship, yet Hui never lost his joy.'],
  ['analects', '禮，與其奢也，寧儉。', 'In ceremonies, it is better to be frugal than extravagant.'],
  ['analects', '奢則不孫，儉則固；與其不孫也，寧固。', 'Extravagance leads to arrogance, frugality to shabbiness; better shabby than arrogant.'],
  ['analects', '君子坦蕩蕩，小人長戚戚。', 'The gentleman is calm and at ease; the petty man is always anxious.'],
  ['analects', '知者不惑，仁者不憂，勇者不懼。', 'The wise are not perplexed, the benevolent are not anxious, the brave are not afraid.'],
  ['analects', '富與貴，是人之所欲也；不以其道得之，不處也。', 'Wealth and rank are what people desire; but if they cannot be obtained in the right way, they should not be held.'],
  ['mencius', '養心莫善於寡欲。', 'For nourishing the mind, nothing is better than having few desires.'],
  ['xunzi', '君子役物，小人役於物。', 'The gentleman makes things serve him; the petty man is made to serve things.'],
  ['zhuangzi', '鷦鷯巢於深林，不過一枝；偃鼠飲河，不過滿腹。', 'The wren nesting in the deep forest uses no more than a single branch; the mole drinking from the river takes no more than a bellyful.'],
  ['zhuangzi', '至樂無樂，至譽無譽。', 'Perfect joy is to be without joy; perfect praise is to be without praise.'],
  ['caigentan', '寵辱不驚，閒看庭前花開花落；去留無意，漫隨天外雲卷雲舒。', 'Unmoved by favor or disgrace, watch the flowers bloom and fall; indifferent to staying or going, follow the clouds as they gather and drift.', 1],
  ['fanzhongyan', '不以物喜，不以己悲。', 'Be not elated by external gains, nor saddened by personal losses.'],
  ['zhugeliang', '靜以修身，儉以養德。', 'Cultivate yourself through calm; nurture virtue through frugality.'],
  ['zhugeliang', '非淡泊無以明志，非寧靜無以致遠。', 'Without simplicity one cannot clarify one’s aims; without tranquility one cannot reach far.'],
  ['zhuzi', '一粥一飯，當思來處不易；半絲半縷，恆念物力維艱。', 'For every bowl of porridge, remember how hard it was to come by; for every thread, remember the labor it took.'],
  ['zengguang', '良田萬頃，日食一升；大廈千間，夜眠八尺。', 'Own ten thousand acres, you still eat one measure of rice a day; own a thousand rooms, you still sleep in eight feet at night.'],
  ['cnproverb', '知足常樂。', 'Contentment brings lasting happiness.'],
  ['cnproverb', '比上不足，比下有餘。', 'Short of those above, but better off than those below.'],
  ['cnproverb', '錢財乃身外之物，生不帶來，死不帶去。', 'Money is outside the self: we bring none at birth and take none at death.'],
  ['cnproverb', '花錢買教訓。', 'Some lessons are bought with money.'],
].map((q, i) => ({ id: i, a: q[0], zh: q[1], en: q[2], att: !!q[3] }));

function authorZh(q){ return AUTHORS[q.a][0] + (q.att ? '（傳）' : ''); }
function authorEn(q){ return AUTHORS[q.a][1] + (q.att ? ' (attributed)' : ''); }

// ─── state ───────────────────────────────────────────────────────────────
const LS = 'ftk-quotes-';
function lsGet(k, d){ try { const v = localStorage.getItem(LS + k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(LS + k, v); } catch (e) {} }

let playlist = QUOTES.map(q => q.id);
let pos = 0;
let playing = false;
let runToken = 0;            // bumped on every stop/restart so stale async loops exit
let shuffle = lsGet('shuffle', '0') === '1';
let loop = lsGet('loop', '1') === '1';

const $ = id => document.getElementById(id);
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

// ─── voices ──────────────────────────────────────────────────────────────
let voices = [];
function loadVoices(){ if (hasTTS) voices = speechSynthesis.getVoices() || []; }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(prefixes){
  for (const p of prefixes) {
    const v = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(p));
    if (v) return v;
  }
  return null;
}

// Speak one piece of text; resolves on end/error, or after a safety timeout
// (some browsers never fire onend, which would otherwise stall auto-play).
function speakText(text, lang){
  return new Promise(resolve => {
    const rate = parseFloat($('rngRate').value) || 1;
    const fallbackMs = Math.max(3000, text.length * (lang === 'zh' ? 260 : 75) / rate) + 1500;
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(finish, fallbackMs);
    if (!hasTTS) return; // text-only mode: just wait out the timer
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
    const v = lang === 'zh' ? pickVoice(['zh-tw', 'zh-hk', 'zh']) : pickVoice(['en-us', 'en']);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = finish;
    u.onerror = finish;
    // If speak() throws, fall back to the timer instead of letting the
    // rejection kill the whole auto-play loop.
    try { speechSynthesis.speak(u); } catch (e) { console.warn('speak failed', e); }
  });
}

async function speakQuote(q, token){
  if (hasTTS) speechSynthesis.cancel();
  const mode = $('selLang').value;
  if (mode === 'zh' || mode === 'both') {
    await speakText(q.zh.replace(/[。！？!?]+$/, '') + '。' + authorZh(q), 'zh');
    if (token !== runToken) return;
  }
  if (mode === 'en' || mode === 'both') {
    await speakText(q.en + ' — ' + authorEn(q), 'en');
  }
}

function sleep(ms, token){
  return new Promise(resolve => {
    const start = Date.now();
    const tick = () => (token !== runToken || Date.now() - start >= ms) ? resolve() : setTimeout(tick, 100);
    tick();
  });
}

// ─── playlist / filters ──────────────────────────────────────────────────
function rebuildPlaylist(keepId){
  const author = $('selAuthor').value;
  const kw = $('txtSearch').value.trim().toLowerCase();
  let ids = QUOTES.filter(q =>
    (!author || q.a === author) &&
    (!kw || (q.zh + ' ' + q.en + ' ' + authorZh(q) + ' ' + authorEn(q)).toLowerCase().includes(kw))
  ).map(q => q.id);
  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  }
  playlist = ids;
  const idx = keepId == null ? -1 : playlist.indexOf(keepId);
  pos = idx >= 0 ? idx : 0;
  renderGrid();
  renderCurrent();
}

function currentQuote(){ return playlist.length ? QUOTES[playlist[pos]] : null; }

function renderCurrent(){
  const q = currentQuote();
  $('qCount').textContent = q ? `#${q.id + 1}  ·  ${pos + 1} / ${playlist.length}` : '0 / 0';
  $('qZh').textContent = q ? '「' + q.zh + '」' : '沒有符合條件的名言。';
  $('qEn').textContent = q ? '“' + q.en + '”' : '';
  $('qAuthor').textContent = q ? '— ' + authorZh(q) + ' ' + authorEn(q) : '';
  document.querySelectorAll('.q-card').forEach(c => c.classList.toggle('current', q && +c.dataset.id === q.id));
  if (q) {
    // Keep the "start from #N" box in sync and remember the position so a
    // reload resumes where the user left off.
    if (document.activeElement !== $('numStart')) $('numStart').value = q.id + 1;
    lsSet('last', String(q.id));
  }
}

// Jump to quote #n (1-based, the permanent number shown on each card). If an
// author/keyword filter hides it, clear the filters first so it can be found.
function jumpTo(n){
  n = Math.round(n);
  if (!(n >= 1 && n <= QUOTES.length)) { $('numStart').value = currentQuote() ? currentQuote().id + 1 : 1; return; }
  const id = n - 1;
  if (playlist.indexOf(id) < 0) {
    $('selAuthor').value = ''; $('txtSearch').value = '';
    rebuildPlaylist(id);
  } else {
    pos = playlist.indexOf(id); renderCurrent();
  }
  const card = document.querySelector(`.q-card[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (playing) { stop(); autoPlay(); }
}

function renderGrid(){
  const grid = $('qGrid');
  if (!playlist.length) { grid.innerHTML = '<div class="q-empty">沒有符合條件的名言 No matching quotes.</div>'; return; }
  grid.innerHTML = playlist.map(id => {
    const q = QUOTES[id];
    return `<div class="q-card" data-id="${q.id}">
      <div class="n">#${q.id + 1}</div>
      <div class="z">${q.zh}</div>
      <div class="e">${q.en}</div>
      <div class="a">— ${authorZh(q)} ${authorEn(q)}</div>
    </div>`;
  }).join('');
}

function setStatus(){
  $('qStatus').textContent = playing ? '▶ 自動播放中 Playing' : '已停止 Stopped';
  $('qStatus').classList.toggle('on', playing);
  $('btnPlay').textContent = playing ? '⏸ 暫停 Pause' : '▶ 自動播放 Auto-play';
}

// ─── playback ────────────────────────────────────────────────────────────
async function autoPlay(){
  const token = ++runToken;
  playing = true; setStatus();
  while (playing && token === runToken && playlist.length) {
    renderCurrent();
    const card = document.querySelector(`.q-card[data-id="${playlist[pos]}"]`);
    if (card && window.matchMedia('(min-width:601px)').matches) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    await speakQuote(currentQuote(), token);
    if (token !== runToken) return;
    await sleep(parseInt($('selGap').value, 10) || 2500, token);
    if (token !== runToken) return;
    if (pos + 1 >= playlist.length) {
      if (!loop) { stop(); return; }
      if (shuffle) { rebuildPlaylist(null); } else { pos = 0; }
    } else {
      pos++;
    }
  }
}

function stop(){
  runToken++;
  playing = false;
  if (hasTTS) speechSynthesis.cancel();
  setStatus();
}

async function speakCurrentOnce(){
  const wasPlaying = playing;
  stop();
  const q = currentQuote(); if (!q) return;
  const token = runToken;
  await speakQuote(q, token);
  if (wasPlaying && token === runToken) autoPlay();
}

function step(delta){
  if (!playlist.length) return;
  pos = (pos + delta + playlist.length) % playlist.length;
  renderCurrent();
  if (playing) { stop(); autoPlay(); }
}

// ─── wiring ──────────────────────────────────────────────────────────────
Object.keys(AUTHORS).forEach(k => {
  const n = QUOTES.filter(q => q.a === k).length;
  if (!n) return;
  const o = document.createElement('option');
  o.value = k; o.textContent = `${AUTHORS[k][0]} ${AUTHORS[k][1]} (${n})`;
  $('selAuthor').appendChild(o);
});

$('selLang').value = lsGet('lang', 'zh');
$('rngRate').value = lsGet('rate', '1');
$('rateVal').textContent = parseFloat($('rngRate').value).toFixed(1) + 'x';
$('selGap').value = lsGet('gap', '2500');
$('btnShuffle').classList.toggle('on', shuffle);
$('btnLoop').classList.toggle('on', loop);

$('btnPlay').addEventListener('click', () => playing ? stop() : autoPlay());
$('btnStop').addEventListener('click', stop);
$('btnPrev').addEventListener('click', () => step(-1));
$('btnNext').addEventListener('click', () => step(1));
$('btnSpeakOne').addEventListener('click', speakCurrentOnce);
$('btnShuffle').addEventListener('click', () => {
  shuffle = !shuffle; lsSet('shuffle', shuffle ? '1' : '0');
  $('btnShuffle').classList.toggle('on', shuffle);
  const q = currentQuote(); rebuildPlaylist(q ? q.id : null);
});
$('btnLoop').addEventListener('click', () => {
  loop = !loop; lsSet('loop', loop ? '1' : '0');
  $('btnLoop').classList.toggle('on', loop);
});
$('selLang').addEventListener('change', e => lsSet('lang', e.target.value));
$('selGap').addEventListener('change', e => lsSet('gap', e.target.value));
$('rngRate').addEventListener('input', e => {
  $('rateVal').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
  lsSet('rate', e.target.value);
});
$('selAuthor').addEventListener('change', () => { stop(); rebuildPlaylist(null); });
$('txtSearch').addEventListener('input', () => { stop(); rebuildPlaylist(null); });

$('qGrid').addEventListener('click', e => {
  const card = e.target.closest('.q-card'); if (!card) return;
  const idx = playlist.indexOf(+card.dataset.id); if (idx < 0) return;
  pos = idx; renderCurrent();
  // While auto-playing, clicking a card continues auto-play from that card
  // (instead of speaking it once and then repeating it).
  if (playing) { stop(); autoPlay(); } else speakCurrentOnce();
});

$('numStart').max = QUOTES.length;
$('btnJump').addEventListener('click', () => jumpTo(parseFloat($('numStart').value)));
$('numStart').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); jumpTo(parseFloat(e.target.value)); } });

if (!hasTTS) {
  $('qNote').style.display = 'block';
  $('qNote').textContent = '⚠ 此瀏覽器不支援語音朗讀，自動播放將只顯示文字。 This browser has no text-to-speech; auto-play will show text only.';
}
window.addEventListener('beforeunload', () => { if (hasTTS) speechSynthesis.cancel(); });

const lastId = parseInt(lsGet('last', ''), 10);
rebuildPlaylist(lastId >= 0 && lastId < QUOTES.length && !shuffle ? lastId : null);
setStatus();
</script>

<script>window.FTK_ROOT = '../../'; window.FTK_PAGE = 'quotes';</script>
<script src="../../assets/shared.js"></script>
</body>
</html>
