<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投資名言 1000 句 Investment Quotes — FinTech Toolkit</title>
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="../../assets/shared.css">
<style>
.q-wrap{ max-width:1180px; margin:0 auto; padding:0 16px 56px; }
.q-player{
  background:var(--ftk-bg-elev); border:1px solid var(--ftk-border); border-radius:16px;
  box-shadow:var(--ftk-shadow); padding:22px 24px; margin:14px 0 18px; position:sticky; top:64px; z-index:5;
}
.q-meta{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ftk-text-dim); margin-bottom:10px; gap:8px; flex-wrap:wrap; }
.q-count{ font-family:Consolas,monospace; color:var(--ftk-accent); font-weight:700; }
.q-status{ font-size:12px; }
.q-status.on{ color:var(--ftk-success); }
.q-zh{ font-size:22px; line-height:1.55; font-weight:700; color:var(--ftk-text); min-height:2.2em; }
.q-en{ font-size:14.5px; line-height:1.6; color:var(--ftk-text-dim); margin-top:6px; font-style:italic; }
.q-author{ margin-top:10px; font-size:13px; color:var(--ftk-accent); font-weight:600; }
.q-controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
.q-btn{
  border:1px solid var(--ftk-border); background:var(--ftk-bg); color:var(--ftk-text);
  border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.q-btn:hover{ border-color:var(--ftk-accent); }
.q-btn.primary{ background:var(--ftk-accent); color:#241a05; border-color:var(--ftk-accent); font-weight:700; }
.q-btn.toggle.on{ border-color:var(--ftk-accent-2); color:var(--ftk-accent-2); font-weight:700; }
.q-settings{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:12px; font-size:12.5px; color:var(--ftk-text-dim); }
.q-settings input[type=number]{ width:64px; }
.q-settings select, .q-settings input[type=text], .q-settings input[type=number]{
  background:var(--ftk-bg); color:var(--ftk-text); border:1px solid var(--ftk-border); border-radius:8px; padding:5px 8px; font-size:12.5px;
}
.q-settings input[type=range]{ vertical-align:middle; accent-color:var(--ftk-accent); }
.q-note{ margin-top:10px; font-size:12px; color:var(--ftk-danger); display:none; }

/* Quote of the day */
.q-daily{
  display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:18px;
  background:var(--ftk-bg-elev); border:1px solid var(--ftk-border); border-left:4px solid var(--ftk-accent);
  border-radius:12px; padding:12px 16px; font-size:13.5px; color:var(--ftk-text);
}
.q-daily .lbl{ font-weight:700; color:var(--ftk-accent); white-space:nowrap; }
.q-daily .txt{ flex:1; min-width:200px; line-height:1.55; }
.q-daily .by{ color:var(--ftk-text-dim); font-size:12px; }

/* Category tabs */
.q-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
.q-tab{
  border:1px solid var(--ftk-border); background:var(--ftk-bg-elev); color:var(--ftk-text-dim);
  border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.q-tab:hover{ border-color:var(--ftk-accent); color:var(--ftk-text); }
.q-tab.on{ background:var(--ftk-accent); border-color:var(--ftk-accent); color:#241a05; font-weight:700; }
.q-tab .c{ opacity:.75; font-size:11.5px; margin-left:4px; }

.q-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.q-card{
  position:relative; background:var(--ftk-bg-elev); border:1px solid var(--ftk-border); border-radius:12px;
  padding:14px 16px; cursor:pointer; transition:border-color .15s, transform .15s;
}
.q-card:hover{ border-color:var(--ftk-accent); transform:translateY(-2px); }
.q-card.current{ border-color:var(--ftk-accent); box-shadow:0 0 0 2px var(--ftk-accent) inset; }
.q-card .n{ font-family:Consolas,monospace; font-size:11px; color:var(--ftk-accent); }
.q-card .z{ font-size:14px; line-height:1.55; color:var(--ftk-text); margin-top:4px; padding-right:18px; }
.q-card .e{ font-size:12px; line-height:1.5; color:var(--ftk-text-dim); margin-top:4px; font-style:italic; }
.q-card .a{ font-size:12px; color:var(--ftk-accent-2); margin-top:6px; }
.fav{
  position:absolute; top:8px; right:10px; background:none; border:none; cursor:pointer;
  font-size:18px; line-height:1; color:var(--ftk-text-dim); padding:4px;
}
.fav.on{ color:#f5b301; }
.q-empty{ color:var(--ftk-text-dim); font-size:13px; padding:20px 0; }
.q-more{ grid-column:1/-1; justify-self:center; margin:6px 0 4px; }
@media (max-width:600px){
  .q-player{ position:static; padding:18px; }
  .q-zh{ font-size:18px; }
}
</style>
</head>
<body class="ftk-page">

<div class="ftk-hero">
  <h1>🎙️ 投資名言 1000 句</h1>
  <p>1000 Investment Quotes · 中英雙語 · 語音朗讀 · 自動播放。點任何一句即可朗讀，或按「自動播放」依序聆聽。</p>
</div>

<div class="q-wrap">
  <div class="q-daily" id="daily">
    <span class="lbl">📅 今日金句 <span id="dailyDate"></span></span>
    <span class="txt"><span id="dailyText"></span> <span class="by" id="dailyBy"></span></span>
    <button type="button" class="q-btn" id="btnDaily">▶ 聽今日金句</button>
  </div>

  <div class="q-player" id="player">
    <div class="q-meta">
      <span class="q-count" id="qCount">#1 / 1000</span>
      <span class="q-status" id="qStatus">已停止 Stopped</span>
    </div>
    <div class="q-zh" id="qZh"></div>
    <div class="q-en" id="qEn"></div>
    <div class="q-author" id="qAuthor"></div>

    <div class="q-controls">
      <button type="button" class="q-btn" id="btnPrev" title="上一句 Previous">⏮</button>
      <button type="button" class="q-btn primary" id="btnPlay">▶ 自動播放 Auto-play</button>
      <button type="button" class="q-btn" id="btnStop">⏹ 停止 Stop</button>
      <button type="button" class="q-btn" id="btnNext" title="下一句 Next">⏭</button>
      <button type="button" class="q-btn" id="btnSpeakOne" title="只朗讀目前這一句">🔊 朗讀本句</button>
      <button type="button" class="q-btn toggle" id="btnShuffle">🔀 隨機</button>
      <button type="button" class="q-btn toggle" id="btnLoop">🔁 循環</button>
      <button type="button" class="q-btn toggle" id="btnFav" title="收藏 / 取消收藏這一句">☆ 收藏</button>
      <button type="button" class="q-btn" id="btnShare" title="把這一句做成圖片，下載或分享">🖼 分享圖卡</button>
    </div>

    <div class="q-settings">
      <label title="輸入句號後按 Enter 或「跳至」，自動播放會從這一句開始">從第
        <input type="number" id="numStart" min="1" max="1000" value="1" inputmode="numeric"> 句
        <button type="button" class="q-btn" id="btnJump" style="padding:5px 12px">跳至 Go</button>
      </label>
      <label>朗讀語言
        <select id="selLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="both">中 + 英</option>
        </select>
      </label>
      <label>語速 <input type="range" id="rngRate" min="0.6" max="1.4" step="0.1" value="1"> <span id="rateVal">1.0x</span></label>
      <label>間隔
        <select id="selGap">
          <option value="1000">1 秒</option>
          <option value="2500" selected>2.5 秒</option>
          <option value="5000">5 秒</option>
          <option value="10000">10 秒</option>
        </select>
      </label>
      <label title="自動播放到時間後，在念完當句時停止">⏲ 定時停止
        <select id="selTimer">
          <option value="0">關閉</option>
          <option value="10">10 分鐘</option>
          <option value="20">20 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="60">60 分鐘</option>
        </select>
      </label>
      <button type="button" class="q-btn" id="btnSleep" style="padding:5px 12px" title="語速 0.8x、間隔 5 秒、20 分鐘後自動停止">🌙 睡前模式</button>
      <label>作者 <select id="selAuthor" style="max-width:min(60vw,320px)"><option value="">全部 All</option></select></label>
      <label>搜尋 <input type="text" id="txtSearch" placeholder="關鍵字 / keyword" size="14"></label>
    </div>
    <div class="q-note" id="qNote"></div>
  </div>

  <div class="q-tabs" id="qTabs" role="tablist"></div>
  <div class="q-grid" id="qGrid"></div>
</div>

<script src="quotes-data.js"></script>
<script>
// ─── state ───────────────────────────────────────────────────────────────
const LS = 'ftk-quotes-';
function lsGet(k, d){ try { const v = localStorage.getItem(LS + k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(LS + k, v); } catch (e) {} }

let playlist = QUOTES.map(q => q.id);
let pos = 0;
let playing = false;
let runToken = 0;            // bumped on every stop/restart so stale async loops exit
let shuffle = lsGet('shuffle', '0') === '1';
let loop = lsGet('loop', '1') === '1';
let sleepUntil = 0;          // epoch ms when the sleep timer stops auto-play (0 = off)

let favs = new Set();
try { favs = new Set(JSON.parse(lsGet('favs', '[]')).filter(n => Number.isInteger(n) && n >= 0 && n < QUOTES.length)); } catch (e) {}
function saveFavs(){ lsSet('favs', JSON.stringify([...favs].sort((a, b) => a - b))); }

// Category tabs. Book digests are flagged in the data; the two digest
// batches are told apart by number range (#601–800 money, #801–1000 emotion).
const CATS = [
  { key: 'all',     zh: '全部',         test: () => true },
  { key: 'quotes',  zh: '名言',         test: q => !q.digest },
  { key: 'money',   zh: '理財書摘',     test: q => q.digest && q.id < 800 },
  { key: 'emotion', zh: '情緒穩定書摘', test: q => q.digest && q.id >= 800 },
  { key: 'fav',     zh: '⭐ 我的收藏',  test: q => favs.has(q.id) },
];
let cat = lsGet('cat', 'all');
if (!CATS.some(c => c.key === cat)) cat = 'all';

const PAGE = 60;             // cards rendered per "page" of the grid
let renderLimit = PAGE;

const $ = id => document.getElementById(id);
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

// ─── voices ──────────────────────────────────────────────────────────────
let voices = [];
function loadVoices(){ if (hasTTS) voices = speechSynthesis.getVoices() || []; }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(prefixes){
  for (const p of prefixes) {
    const v = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(p));
    if (v) return v;
  }
  return null;
}

// Speak one piece of text; resolves on end/error, or after a safety timeout
// (some browsers never fire onend, which would otherwise stall auto-play).
function speakText(text, lang){
  return new Promise(resolve => {
    const rate = parseFloat($('rngRate').value) || 1;
    const fallbackMs = Math.max(3000, text.length * (lang === 'zh' ? 260 : 75) / rate) + 1500;
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(finish, fallbackMs);
    if (!hasTTS) return; // text-only mode: just wait out the timer
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
    const v = lang === 'zh' ? pickVoice(['zh-tw', 'zh-hk', 'zh']) : pickVoice(['en-us', 'en']);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = finish;
    u.onerror = finish;
    // If speak() throws, fall back to the timer instead of letting the
    // rejection kill the whole auto-play loop.
    try { speechSynthesis.speak(u); } catch (e) { console.warn('speak failed', e); }
  });
}

// Author name for the *Chinese* voice: drop English book titles and years
// (a zh voice reading "Shift (2025)" sounds broken) and say the tag in words.
function spokenAuthorZh(q){
  let n = AUTHORS[q.a][0]
    .replace(/\(\d{4}\)|（\d{4}[^）]*）/g, '')
    .replace(/[A-Za-z][A-Za-z0-9 ,.&?:'’!-]*/g, '')
    .replace(/[()（）]/g, '')
    .replace(/\s+/g, ' ').trim();
  if (q.digest) n += '，書摘';
  else if (q.att) n += '，相傳';
  return n;
}

async function speakQuote(q, token){
  if (hasTTS) speechSynthesis.cancel();
  const mode = $('selLang').value;
  if (mode === 'zh' || mode === 'both') {
    await speakText(q.zh.replace(/[。！？!?]+$/, '') + '。' + spokenAuthorZh(q), 'zh');
    if (token !== runToken) return;
  }
  if (mode === 'en' || mode === 'both') {
    await speakText(q.en + ' — ' + authorEn(q), 'en');
  }
}

function sleep(ms, token){
  return new Promise(resolve => {
    const start = Date.now();
    const tick = () => (token !== runToken || Date.now() - start >= ms) ? resolve() : setTimeout(tick, 100);
    tick();
  });
}

// ─── playlist / filters ──────────────────────────────────────────────────
function rebuildPlaylist(keepId){
  const author = $('selAuthor').value;
  const kw = $('txtSearch').value.trim().toLowerCase();
  const c = CATS.find(c => c.key === cat);
  let ids = QUOTES.filter(q =>
    c.test(q) &&
    (!author || q.a === author) &&
    (!kw || (q.zh + ' ' + q.en + ' ' + authorZh(q) + ' ' + authorEn(q)).toLowerCase().includes(kw))
  ).map(q => q.id);
  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  }
  playlist = ids;
  const idx = keepId == null ? -1 : playlist.indexOf(keepId);
  pos = idx >= 0 ? idx : 0;
  renderLimit = Math.max(PAGE, Math.ceil((pos + 1) / PAGE) * PAGE);
  renderTabs();
  renderGrid();
  renderCurrent();
}

function currentQuote(){ return playlist.length ? QUOTES[playlist[pos]] : null; }

function renderCurrent(){
  const q = currentQuote();
  $('qCount').textContent = q ? `#${q.id + 1}  ·  ${pos + 1} / ${playlist.length}` : '0 / 0';
  // Book digests are paraphrases, so they get no quotation marks.
  $('qZh').textContent = q ? (q.digest ? q.zh : '「' + q.zh + '」') : (cat === 'fav' ? '還沒有收藏。點任何一句右上角的 ☆ 就能加入收藏。' : '沒有符合條件的名言。');
  $('qEn').textContent = q ? (q.digest ? q.en : '“' + q.en + '”') : '';
  $('qAuthor').textContent = q ? '— ' + authorZh(q) + ' ' + authorEn(q) : '';
  document.querySelectorAll('.q-card').forEach(c => c.classList.toggle('current', q && +c.dataset.id === q.id));
  const on = !!(q && favs.has(q.id));
  $('btnFav').classList.toggle('on', on);
  $('btnFav').textContent = on ? '★ 已收藏' : '☆ 收藏';
  if (q) {
    // Keep the "start from #N" box in sync and remember the position so a
    // reload resumes where the user left off.
    if (document.activeElement !== $('numStart')) $('numStart').value = q.id + 1;
    lsSet('last', String(q.id));
  }
}

// Make sure the card at playlist index idx is rendered (the grid only
// renders the first renderLimit cards and grows on demand).
function ensureRendered(idx){
  if (idx < renderLimit) return;
  renderLimit = Math.ceil((idx + 1) / PAGE) * PAGE;
  renderGrid();
  renderCurrent();
}

function scrollToCard(id, smooth){
  const card = document.querySelector(`.q-card[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
}

// Jump to quote #n (1-based, the permanent number shown on each card). If a
// category/author/keyword filter hides it, clear the filters first.
function jumpTo(n){
  n = Math.round(n);
  if (!(n >= 1 && n <= QUOTES.length)) { $('numStart').value = currentQuote() ? currentQuote().id + 1 : 1; return; }
  const id = n - 1;
  if (playlist.indexOf(id) < 0) {
    $('selAuthor').value = ''; $('txtSearch').value = '';
    setCat('all', id);
  } else {
    pos = playlist.indexOf(id);
    ensureRendered(pos);
    renderCurrent();
  }
  scrollToCard(id, false);
  if (playing) restart();
}

function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function cardHtml(q){
  const on = favs.has(q.id);
  return `<div class="q-card" data-id="${q.id}">
      <button type="button" class="fav${on ? ' on' : ''}" data-fav="${q.id}" title="${on ? '取消收藏' : '收藏'}" aria-label="收藏">${on ? '★' : '☆'}</button>
      <div class="n">#${q.id + 1}</div>
      <div class="z">${escapeHtml(q.zh)}</div>
      <div class="e">${escapeHtml(q.en)}</div>
      <div class="a">— ${escapeHtml(authorZh(q) + ' ' + authorEn(q))}</div>
    </div>`;
}

function renderGrid(){
  const grid = $('qGrid');
  if (!playlist.length) {
    grid.innerHTML = `<div class="q-empty">${cat === 'fav' ? '還沒有收藏任何一句。點卡片右上角的 ☆ 就能收藏，之後可以只播放收藏的句子。' : '沒有符合條件的名言 No matching quotes.'}</div>`;
    return;
  }
  const shown = playlist.slice(0, renderLimit);
  const rest = playlist.length - shown.length;
  grid.innerHTML = shown.map(id => cardHtml(QUOTES[id])).join('') +
    (rest > 0 ? `<button type="button" class="q-btn q-more" id="btnMore">顯示更多（還有 ${rest} 句）</button>` : '');
  const more = $('btnMore');
  if (more && moreObserver) moreObserver.observe(more);
}

function loadMore(){
  if (renderLimit >= playlist.length) return;
  renderLimit += PAGE;
  renderGrid();
  renderCurrent();
}
// Auto-load the next page when the "顯示更多" button scrolls into view.
const moreObserver = 'IntersectionObserver' in window
  ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadMore(); }, { rootMargin: '400px' })
  : null;

function renderTabs(){
  $('qTabs').innerHTML = CATS.map(c => {
    const n = QUOTES.filter(c.test).length;
    return `<button type="button" class="q-tab${c.key === cat ? ' on' : ''}" data-cat="${c.key}" role="tab" aria-selected="${c.key === cat}">${c.zh}<span class="c">${n}</span></button>`;
  }).join('');
}

function setCat(key, keepId){
  cat = key; lsSet('cat', key);
  rebuildPlaylist(keepId === undefined ? null : keepId);
}

function toggleFav(id){
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  saveFavs();
  const on = favs.has(id);
  document.querySelectorAll(`.fav[data-fav="${id}"]`).forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '★' : '☆'; b.title = on ? '取消收藏' : '收藏'; });
  if (cat === 'fav') {
    const q = currentQuote();
    rebuildPlaylist(q ? q.id : null);
  } else {
    renderTabs();
    renderCurrent();
  }
}

function setStatus(){
  let s = playing ? '▶ 自動播放中 Playing' : '已停止 Stopped';
  if (playing && sleepUntil) s += ` · ⏲ 剩 ${Math.max(1, Math.ceil((sleepUntil - Date.now()) / 60000))} 分`;
  $('qStatus').textContent = s;
  $('qStatus').classList.toggle('on', playing);
  $('btnPlay').textContent = playing ? '⏸ 暫停 Pause' : '▶ 自動播放 Auto-play';
}
setInterval(() => { if (playing && sleepUntil) setStatus(); }, 20000);

function armSleepTimer(){
  const m = parseInt($('selTimer').value, 10) || 0;
  sleepUntil = m ? Date.now() + m * 60000 : 0;
  setStatus();
}

// ─── playback ────────────────────────────────────────────────────────────
async function autoPlay(){
  const token = ++runToken;
  playing = true; setStatus();
  while (playing && token === runToken && playlist.length) {
    ensureRendered(pos);
    renderCurrent();
    if (window.matchMedia('(min-width:601px)').matches) scrollToCard(playlist[pos], true);
    await speakQuote(currentQuote(), token);
    if (token !== runToken) return;
    await sleep(parseInt($('selGap').value, 10) || 2500, token);
    if (token !== runToken) return;
    if (sleepUntil && Date.now() >= sleepUntil) { stop(); $('qStatus').textContent = '⏲ 定時已到，已停止 Sleep timer ended'; return; }
    if (pos + 1 >= playlist.length) {
      if (!loop) { stop(); return; }
      if (shuffle) { rebuildPlaylist(null); } else { pos = 0; }
    } else {
      pos++;
    }
  }
}

function stop(){
  runToken++;
  playing = false;
  sleepUntil = 0;
  if (hasTTS) speechSynthesis.cancel();
  setStatus();
}

// Restart auto-play from the current position, keeping the sleep timer.
function restart(){
  runToken++;
  if (hasTTS) speechSynthesis.cancel();
  autoPlay();
}

async function speakCurrentOnce(){
  const wasPlaying = playing, timer = sleepUntil;
  stop();
  const q = currentQuote(); if (!q) return;
  const token = runToken;
  await speakQuote(q, token);
  if (wasPlaying && token === runToken) { sleepUntil = timer; autoPlay(); }
}

function step(delta){
  if (!playlist.length) return;
  pos = (pos + delta + playlist.length) % playlist.length;
  ensureRendered(pos);
  renderCurrent();
  if (playing) restart();
}

// ─── share card (PNG) ────────────────────────────────────────────────────
function wrapText(ctx, text, maxW, byWord){
  const units = byWord ? text.split(/(\s+)/) : Array.from(text);
  const lines = []; let line = '';
  for (const u of units) {
    const test = line + u;
    // Never start a line with closing punctuation (」。，…): let it overhang.
    const closer = !byWord && /^[」』。，、！？；：）”’…]$/.test(u);
    if (ctx.measureText(test).width > maxW && line.trim() && !closer) { lines.push(line.trim()); line = u.trimStart(); }
    else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function drawShareCard(q){
  const W = 1080, H = 1350, PAD = 96, maxW = W - PAD * 2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0b0e14'); g.addColorStop(1, '#1c2333');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const zhText = q.digest ? q.zh : '「' + q.zh + '」';
  const enText = q.digest ? q.en : '“' + q.en + '”';
  const sans = '"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
  // Shrink the fonts until everything fits between the header and footer.
  let zs = 64, es = 34, zl, el;
  for (; zs >= 34; zs -= 4, es = Math.max(24, es - 2)) {
    ctx.font = `700 ${zs}px ${sans}`; zl = wrapText(ctx, zhText, maxW, false);
    ctx.font = `italic ${es}px Georgia,serif`; el = wrapText(ctx, enText, maxW, true);
    if (zl.length * zs * 1.5 + el.length * es * 1.5 + 140 < H - 420) break;
  }
  // Vertically center the block (accent bar + quote + translation + author).
  ctx.font = `600 32px ${sans}`;
  const al = wrapText(ctx, '— ' + authorZh(q), maxW, false);
  const blockH = 80 + zl.length * zs * 1.5 + 30 + el.length * es * 1.5 + 50 + al.length * 46;
  let y = Math.max(140, (H - 80 - blockH) / 2);
  ctx.fillStyle = '#e0b04a'; ctx.fillRect(PAD, y, 120, 8);
  y += 80;
  ctx.fillStyle = '#f2f4f8'; ctx.font = `700 ${zs}px ${sans}`;
  zl.forEach(l => { ctx.fillText(l, PAD, y + zs); y += zs * 1.5; });
  y += 30;
  ctx.fillStyle = '#9aa4b5'; ctx.font = `italic ${es}px Georgia,serif`;
  el.forEach(l => { ctx.fillText(l, PAD, y + es); y += es * 1.5; });
  y += 50;
  ctx.fillStyle = '#e0b04a'; ctx.font = `600 32px ${sans}`;
  al.forEach(l => { ctx.fillText(l, PAD, y + 32); y += 46; });

  ctx.fillStyle = '#5c6678'; ctx.font = `500 26px ${sans}`;
  ctx.fillText(`#${q.id + 1} · FinTech Toolkit 投資名言`, PAD, H - 90);
  return cv;
}

function shareCard(){
  const q = currentQuote(); if (!q) return;
  const cv = drawShareCard(q);
  const name = `quote-${q.id + 1}.png`;
  cv.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], name, { type: 'image/png' });
    // Phones: open the native share sheet (LINE, IG…). Elsewhere: download.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '投資名言 #' + (q.id + 1) }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}

// ─── quote of the day ────────────────────────────────────────────────────
function renderDaily(){
  const d = new Date(), q = QUOTES[dailyQuoteId(d)];
  $('dailyDate').textContent = `${d.getMonth() + 1}/${d.getDate()}`;
  $('dailyText').textContent = q.digest ? q.zh : '「' + q.zh + '」';
  $('dailyBy').textContent = '— ' + authorZh(q);
}

// ─── wiring ──────────────────────────────────────────────────────────────
Object.keys(AUTHORS).forEach(k => {
  const n = QUOTES.filter(q => q.a === k).length;
  if (!n) return;
  const o = document.createElement('option');
  o.value = k; o.textContent = `${AUTHORS[k][0]} ${AUTHORS[k][1]} (${n})`;
  $('selAuthor').appendChild(o);
});

$('selLang').value = lsGet('lang', 'zh');
$('rngRate').value = lsGet('rate', '1');
$('rateVal').textContent = parseFloat($('rngRate').value).toFixed(1) + 'x';
$('selGap').value = lsGet('gap', '2500');
$('selTimer').value = lsGet('timer', '0');
$('btnShuffle').classList.toggle('on', shuffle);
$('btnLoop').classList.toggle('on', loop);

$('btnPlay').addEventListener('click', () => { if (playing) stop(); else { armSleepTimer(); autoPlay(); } });
$('btnStop').addEventListener('click', stop);
$('btnPrev').addEventListener('click', () => step(-1));
$('btnNext').addEventListener('click', () => step(1));
$('btnSpeakOne').addEventListener('click', speakCurrentOnce);
$('btnShuffle').addEventListener('click', () => {
  shuffle = !shuffle; lsSet('shuffle', shuffle ? '1' : '0');
  $('btnShuffle').classList.toggle('on', shuffle);
  const q = currentQuote(); rebuildPlaylist(q ? q.id : null);
});
$('btnLoop').addEventListener('click', () => {
  loop = !loop; lsSet('loop', loop ? '1' : '0');
  $('btnLoop').classList.toggle('on', loop);
});
$('btnFav').addEventListener('click', () => { const q = currentQuote(); if (q) toggleFav(q.id); });
$('btnShare').addEventListener('click', shareCard);
$('selLang').addEventListener('change', e => lsSet('lang', e.target.value));
$('selGap').addEventListener('change', e => lsSet('gap', e.target.value));
$('selTimer').addEventListener('change', e => { lsSet('timer', e.target.value); if (playing) armSleepTimer(); });
$('rngRate').addEventListener('input', e => {
  $('rateVal').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
  lsSet('rate', e.target.value);
});
$('btnSleep').addEventListener('click', () => {
  $('rngRate').value = '0.8'; $('rateVal').textContent = '0.8x'; lsSet('rate', '0.8');
  $('selGap').value = '5000'; lsSet('gap', '5000');
  $('selTimer').value = '20'; lsSet('timer', '20');
  armSleepTimer();
  if (!playing) autoPlay();
});
$('selAuthor').addEventListener('change', () => { stop(); rebuildPlaylist(null); });
$('txtSearch').addEventListener('input', () => { stop(); rebuildPlaylist(null); });

$('qTabs').addEventListener('click', e => {
  const b = e.target.closest('.q-tab'); if (!b || b.dataset.cat === cat) return;
  stop();
  const q = currentQuote();
  setCat(b.dataset.cat, q ? q.id : null);
});

$('qGrid').addEventListener('click', e => {
  const fav = e.target.closest('.fav');
  if (fav) { e.stopPropagation(); toggleFav(+fav.dataset.fav); return; }
  if (e.target.closest('#btnMore')) { loadMore(); return; }
  const card = e.target.closest('.q-card'); if (!card) return;
  const idx = playlist.indexOf(+card.dataset.id); if (idx < 0) return;
  pos = idx; renderCurrent();
  // While auto-playing, clicking a card continues auto-play from that card
  // (instead of speaking it once and then repeating it).
  if (playing) restart(); else speakCurrentOnce();
});

$('btnDaily').addEventListener('click', () => {
  jumpTo(dailyQuoteId() + 1);
  if (!playing) speakCurrentOnce();
});

$('numStart').max = QUOTES.length;
$('btnJump').addEventListener('click', () => jumpTo(parseFloat($('numStart').value)));
$('numStart').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); jumpTo(parseFloat(e.target.value)); } });

if (!hasTTS) {
  $('qNote').style.display = 'block';
  $('qNote').textContent = '⚠ 此瀏覽器不支援語音朗讀，自動播放將只顯示文字。 This browser has no text-to-speech; auto-play will show text only.';
}
window.addEventListener('beforeunload', () => { if (hasTTS) speechSynthesis.cancel(); });

// Deep link: index.html#q=123 opens quote #123 (used by the home page's
// "今日金句" card). Otherwise resume where the user left off.
const hashN = parseInt((location.hash.match(/q=(\d+)/) || [])[1], 10);
const lastId = parseInt(lsGet('last', ''), 10);
renderDaily();
if (hashN >= 1 && hashN <= QUOTES.length) {
  cat = 'all'; lsSet('cat', 'all');
  rebuildPlaylist(hashN - 1);
} else {
  rebuildPlaylist(lastId >= 0 && lastId < QUOTES.length && !shuffle ? lastId : null);
}
setStatus();
window.addEventListener('hashchange', () => {
  const n = parseInt((location.hash.match(/q=(\d+)/) || [])[1], 10);
  if (n >= 1 && n <= QUOTES.length) jumpTo(n);
});
