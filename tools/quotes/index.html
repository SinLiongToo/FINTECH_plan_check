  ['livermore', '讓我賺大錢的從來不是我的思考，而是我的坐著不動。', 'It never was my thinking that made the big money for me. It always was my sitting.'],

  ['kiyosaki', '重點不是你賺多少錢，而是你能留住多少錢。', 'It’s not how much money you make, but how much money you keep.'],

  ['housel', '理財做得好，跟你多聰明關係不大，跟你怎麼做關係很大。', 'Doing well with money has a little to do with how smart you are and a lot to do with how you behave.'],

  ['kostolany', '經濟是主人，股市是狗：狗會前後亂跑，但最終會和主人一起抵達終點。', 'The economy is the man and the stock market is his dog: the dog runs back and forth, but they arrive together.'],

  ['proverb', '不要把所有的雞蛋放在同一個籃子裡。', 'Don’t put all your eggs in one basket.'],

  ['einstein', '複利是世界第八大奇蹟，懂的人賺它，不懂的人付它。', 'Compound interest is the eighth wonder of the world. He who understands it, earns it; he who doesn’t, pays it.', 1],
].map((q, i) => ({ id: i, a: q[0], zh: q[1], en: q[2], att: !!q[3] }));

function authorZh(q){ return AUTHORS[q.a][0] + (q.att ? '（傳）' : ''); }
function authorEn(q){ return AUTHORS[q.a][1] + (q.att ? ' (attributed)' : ''); }

// ─── state ───────────────────────────────────────────────────────────────
const LS = 'ftk-quotes-';
function lsGet(k, d){ try { const v = localStorage.getItem(LS + k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(LS + k, v); } catch (e) {} }

let playlist = QUOTES.map(q => q.id);
let pos = 0;
let playing = false;
let runToken = 0;            // bumped on every stop/restart so stale async loops exit
let shuffle = lsGet('shuffle', '0') === '1';
let loop = lsGet('loop', '1') === '1';

const $ = id => document.getElementById(id);
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

// ─── voices ──────────────────────────────────────────────────────────────
let voices = [];
function loadVoices(){ if (hasTTS) voices = speechSynthesis.getVoices() || []; }
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(prefixes){
  for (const p of prefixes) {
    const v = voices.find(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(p));
    if (v) return v;
  }
  return null;
}

// Speak one piece of text; resolves on end/error, or after a safety timeout
// (some browsers never fire onend, which would otherwise stall auto-play).
function speakText(text, lang){
  return new Promise(resolve => {
    const rate = parseFloat($('rngRate').value) || 1;
    const fallbackMs = Math.max(3000, text.length * (lang === 'zh' ? 260 : 75) / rate) + 1500;
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
    const t = setTimeout(finish, fallbackMs);
    if (!hasTTS) return; // text-only mode: just wait out the timer
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
    const v = lang === 'zh' ? pickVoice(['zh-tw', 'zh-hk', 'zh']) : pickVoice(['en-us', 'en']);
    if (v) u.voice = v;
    u.rate = rate;
    u.onend = finish;
    u.onerror = finish;
    // If speak() throws, fall back to the timer instead of letting the
    // rejection kill the whole auto-play loop.
    try { speechSynthesis.speak(u); } catch (e) { console.warn('speak failed', e); }
  });
}

async function speakQuote(q, token){
  if (hasTTS) speechSynthesis.cancel();
  const mode = $('selLang').value;
  if (mode === 'zh' || mode === 'both') {
    await speakText(q.zh.replace(/[。！？!?]+$/, '') + '。' + authorZh(q), 'zh');
    if (token !== runToken) return;
  }
  if (mode === 'en' || mode === 'both') {
    await speakText(q.en + ' — ' + authorEn(q), 'en');
  }
}

function sleep(ms, token){
  return new Promise(resolve => {
    const start = Date.now();
    const tick = () => (token !== runToken || Date.now() - start >= ms) ? resolve() : setTimeout(tick, 100);
    tick();
  });
}

// ─── playlist / filters ──────────────────────────────────────────────────
function rebuildPlaylist(keepId){
  const author = $('selAuthor').value;
  const kw = $('txtSearch').value.trim().toLowerCase();
  let ids = QUOTES.filter(q =>
    (!author || q.a === author) &&
    (!kw || (q.zh + ' ' + q.en + ' ' + authorZh(q) + ' ' + authorEn(q)).toLowerCase().includes(kw))
  ).map(q => q.id);
  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  }
  playlist = ids;
  const idx = keepId == null ? -1 : playlist.indexOf(keepId);
  pos = idx >= 0 ? idx : 0;
  renderGrid();
  renderCurrent();
}

function currentQuote(){ return playlist.length ? QUOTES[playlist[pos]] : null; }

function renderCurrent(){
  const q = currentQuote();
  $('qCount').textContent = q ? `#${q.id + 1}  ·  ${pos + 1} / ${playlist.length}` : '0 / 0';
  $('qZh').textContent = q ? '「' + q.zh + '」' : '沒有符合條件的名言。';
  $('qEn').textContent = q ? '“' + q.en + '”' : '';
  $('qAuthor').textContent = q ? '— ' + authorZh(q) + ' ' + authorEn(q) : '';
  document.querySelectorAll('.q-card').forEach(c => c.classList.toggle('current', q && +c.dataset.id === q.id));
}

function renderGrid(){
  const grid = $('qGrid');
  if (!playlist.length) { grid.innerHTML = '<div class="q-empty">沒有符合條件的名言 No matching quotes.</div>'; return; }
  grid.innerHTML = playlist.map(id => {
    const q = QUOTES[id];
    return `<div class="q-card" data-id="${q.id}">
      <div class="n">#${q.id + 1}</div>
      <div class="z">${q.zh}</div>
      <div class="e">${q.en}</div>
      <div class="a">— ${authorZh(q)} ${authorEn(q)}</div>
    </div>`;
  }).join('');
}

function setStatus(){
  $('qStatus').textContent = playing ? '▶ 自動播放中 Playing' : '已停止 Stopped';
  $('qStatus').classList.toggle('on', playing);
  $('btnPlay').textContent = playing ? '⏸ 暫停 Pause' : '▶ 自動播放 Auto-play';
}

// ─── playback ────────────────────────────────────────────────────────────
async function autoPlay(){
  const token = ++runToken;
  playing = true; setStatus();
  while (playing && token === runToken && playlist.length) {
    renderCurrent();
    const card = document.querySelector(`.q-card[data-id="${playlist[pos]}"]`);
    if (card && window.matchMedia('(min-width:601px)').matches) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    await speakQuote(currentQuote(), token);
    if (token !== runToken) return;
    await sleep(parseInt($('selGap').value, 10) || 2500, token);
    if (token !== runToken) return;
    if (pos + 1 >= playlist.length) {
      if (!loop) { stop(); return; }
      if (shuffle) { rebuildPlaylist(null); } else { pos = 0; }
    } else {
      pos++;
    }
  }
}

function stop(){
  runToken++;
  playing = false;
  if (hasTTS) speechSynthesis.cancel();
  setStatus();
}

async function speakCurrentOnce(){
  const wasPlaying = playing;
  stop();
  const q = currentQuote(); if (!q) return;
  const token = runToken;
  await speakQuote(q, token);
  if (wasPlaying && token === runToken) autoPlay();
}

function step(delta){
  if (!playlist.length) return;
  pos = (pos + delta + playlist.length) % playlist.length;
  renderCurrent();
  if (playing) { stop(); autoPlay(); }
}

// ─── wiring ──────────────────────────────────────────────────────────────
Object.keys(AUTHORS).forEach(k => {
  const n = QUOTES.filter(q => q.a === k).length;
  if (!n) return;
  const o = document.createElement('option');
  o.value = k; o.textContent = `${AUTHORS[k][0]} ${AUTHORS[k][1]} (${n})`;
  $('selAuthor').appendChild(o);
});

$('selLang').value = lsGet('lang', 'zh');
$('rngRate').value = lsGet('rate', '1');
$('rateVal').textContent = parseFloat($('rngRate').value).toFixed(1) + 'x';
$('selGap').value = lsGet('gap', '2500');
$('btnShuffle').classList.toggle('on', shuffle);
$('btnLoop').classList.toggle('on', loop);

$('btnPlay').addEventListener('click', () => playing ? stop() : autoPlay());
$('btnStop').addEventListener('click', stop);
$('btnPrev').addEventListener('click', () => step(-1));
$('btnNext').addEventListener('click', () => step(1));
$('btnSpeakOne').addEventListener('click', speakCurrentOnce);
$('btnShuffle').addEventListener('click', () => {
  shuffle = !shuffle; lsSet('shuffle', shuffle ? '1' : '0');
  $('btnShuffle').classList.toggle('on', shuffle);
  const q = currentQuote(); rebuildPlaylist(q ? q.id : null);
});
$('btnLoop').addEventListener('click', () => {
  loop = !loop; lsSet('loop', loop ? '1' : '0');
  $('btnLoop').classList.toggle('on', loop);
});
$('selLang').addEventListener('change', e => lsSet('lang', e.target.value));
$('selGap').addEventListener('change', e => lsSet('gap', e.target.value));
$('rngRate').addEventListener('input', e => {
  $('rateVal').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
  lsSet('rate', e.target.value);
});
$('selAuthor').addEventListener('change', () => { stop(); rebuildPlaylist(null); });
$('txtSearch').addEventListener('input', () => { stop(); rebuildPlaylist(null); });

$('qGrid').addEventListener('click', e => {
  const card = e.target.closest('.q-card'); if (!card) return;
  const idx = playlist.indexOf(+card.dataset.id); if (idx < 0) return;
  pos = idx; renderCurrent();
  speakCurrentOnce();
});

if (!hasTTS) {
  $('qNote').style.display = 'block';
  $('qNote').textContent = '⚠ 此瀏覽器不支援語音朗讀，自動播放將只顯示文字。 This browser has no text-to-speech; auto-play will show text only.';
}
window.addEventListener('beforeunload', () => { if (hasTTS) speechSynthesis.cancel(); });

rebuildPlaylist(null);
setStatus();
</script>

<script>window.FTK_ROOT = '../../'; window.FTK_PAGE = 'quotes';</script>
<script src="../../assets/shared.js"></script>
</body>
